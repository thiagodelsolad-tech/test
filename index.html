<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kito — Game</title>
<style>
	html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 12px monospace; overflow: hidden; }
	#canvas { display: block; position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; background: #000; }
	/* Fuente opcional: si no existe /chalet.woff simplemente cae a sans-serif */
	@font-face { font-family: 'Chalet'; src: url('/chalet.woff') format('woff'); font-display: swap; }
	#loading { position: fixed; inset: 0; background: #000; overflow: hidden; transition: opacity .8s; z-index: 5; }
	#loading.done { opacity: 0; pointer-events: none; }
	#ls-stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; font: 12px Chalet, sans-serif; color: #fff; }
	#ls-screens { position: absolute; inset: 0; }
	.ls-screen { position: absolute; inset: 0; }

	/* ============================================================
	   KITO BACKGROUND
	   ============================================================ */
	#kito-bg { position: absolute; inset: 0; overflow: hidden; background: #05060a; }
	.kito-grad {
		position: absolute; inset: -20%;
		background:
			radial-gradient(circle at 20% 30%, rgba(120, 60, 255, 0.55) 0%, transparent 45%),
			radial-gradient(circle at 80% 70%, rgba(255, 60, 140, 0.45) 0%, transparent 50%),
			radial-gradient(circle at 50% 100%, rgba(0, 200, 255, 0.35) 0%, transparent 55%),
			linear-gradient(180deg, #06070f 0%, #0b0a1a 50%, #05060a 100%);
		animation: kito-drift 22s ease-in-out infinite alternate;
		filter: blur(4px);
	}
	@keyframes kito-drift {
		0%   { transform: translate3d(0, 0, 0) scale(1); }
		100% { transform: translate3d(-30px, 20px, 0) scale(1.08); }
	}
	.kito-grid {
		position: absolute; left: -50%; right: -50%; bottom: -10%; height: 70%;
		background-image:
			linear-gradient(rgba(120, 180, 255, 0.28) 1px, transparent 1px),
			linear-gradient(90deg, rgba(120, 180, 255, 0.28) 1px, transparent 1px);
		background-size: 60px 60px;
		transform: perspective(420px) rotateX(62deg);
		transform-origin: center bottom;
		animation: kito-grid-move 6s linear infinite;
		opacity: 0.55;
		mask-image: linear-gradient(180deg, transparent 0%, #000 40%, #000 100%);
		-webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 40%, #000 100%);
	}
	@keyframes kito-grid-move {
		from { background-position: 0 0, 0 0; }
		to   { background-position: 0 60px, 60px 0; }
	}
	.kito-particles { position: absolute; inset: 0; pointer-events: none; }
	.kito-particles span {
		position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff;
		box-shadow: 0 0 8px 2px rgba(150, 180, 255, 0.9); opacity: 0;
		animation: kito-float 9s linear infinite;
	}
	@keyframes kito-float {
		0%   { transform: translateY(40px) scale(0.6); opacity: 0; }
		15%  { opacity: 0.9; }
		85%  { opacity: 0.9; }
		100% { transform: translateY(-560px) scale(1.1); opacity: 0; }
	}
	.kito-particles span:nth-child(1)  { left:  6%; animation-delay: 0.0s; }
	.kito-particles span:nth-child(2)  { left: 14%; animation-delay: 1.3s; }
	.kito-particles span:nth-child(3)  { left: 22%; animation-delay: 2.6s; }
	.kito-particles span:nth-child(4)  { left: 31%; animation-delay: 0.7s; }
	.kito-particles span:nth-child(5)  { left: 39%; animation-delay: 3.9s; }
	.kito-particles span:nth-child(6)  { left: 47%; animation-delay: 1.9s; }
	.kito-particles span:nth-child(7)  { left: 55%; animation-delay: 4.8s; }
	.kito-particles span:nth-child(8)  { left: 63%; animation-delay: 0.4s; }
	.kito-particles span:nth-child(9)  { left: 71%; animation-delay: 2.2s; }
	.kito-particles span:nth-child(10) { left: 79%; animation-delay: 5.4s; }
	.kito-particles span:nth-child(11) { left: 87%; animation-delay: 3.1s; }
	.kito-particles span:nth-child(12) { left: 93%; animation-delay: 1.1s; }
	.kito-particles span:nth-child(13) { left: 10%; animation-delay: 6.0s; }
	.kito-particles span:nth-child(14) { left: 26%; animation-delay: 5.0s; }
	.kito-particles span:nth-child(15) { left: 44%; animation-delay: 7.2s; }
	.kito-particles span:nth-child(16) { left: 58%; animation-delay: 6.6s; }
	.kito-particles span:nth-child(17) { left: 74%; animation-delay: 8.0s; }
	.kito-particles span:nth-child(18) { left: 90%; animation-delay: 4.2s; }
	.kito-glow {
		position: absolute; left: 50%; top: 50%; width: 900px; height: 900px;
		transform: translate(-50%, -50%);
		background: radial-gradient(circle, rgba(180, 120, 255, 0.28) 0%, transparent 60%);
		animation: kito-pulse 4s ease-in-out infinite;
		pointer-events: none; mix-blend-mode: screen;
	}
	@keyframes kito-pulse {
		0%, 100% { transform: translate(-50%, -50%) scale(1);    opacity: 0.7; }
		50%      { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
	}
	.kito-watermark {
		position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%);
		font-family: 'Chalet', 'Arial Black', sans-serif;
		font-size: 260px; font-weight: 900; letter-spacing: 30px;
		color: transparent; -webkit-text-stroke: 2px rgba(255, 255, 255, 0.14);
		text-shadow: 0 0 40px rgba(150, 100, 255, 0.25);
		white-space: nowrap; pointer-events: none;
		animation: kito-wm 8s ease-in-out infinite alternate;
	}
	@keyframes kito-wm {
		from { opacity: 0.7; letter-spacing: 30px; }
		to   { opacity: 1.0; letter-spacing: 38px; }
	}
	.kito-vignette {
		position: absolute; inset: 0;
		background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
		pointer-events: none;
	}
	.kito-scanlines {
		position: absolute; inset: 0;
		background: repeating-linear-gradient(180deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 3px);
		pointer-events: none; mix-blend-mode: overlay;
	}

	/* Logo KITO */
	#kito-logo {
		position: absolute; left: 95px; top: 512px;
		font-family: 'Chalet', 'Arial Black', sans-serif;
		font-size: 92px; font-weight: 900; letter-spacing: 8px; color: #fff;
		text-shadow:
			0 0 12px rgba(180, 120, 255, 0.9),
			0 0 30px rgba(120, 180, 255, 0.6),
			2px 4px 0 rgba(0, 0, 0, 0.6);
		pointer-events: none;
	}
	#kito-logo small {
		display: block; font-size: 14px; letter-spacing: 10px; margin-top: 4px;
		color: rgba(255,255,255,0.7); text-shadow: none; font-weight: 400;
	}

	#ls-bars { position: absolute; right: 96px; top: 642px; display: flex; gap: 3px; }
	.ls-bar { height: 24px; padding: 0 6px; display: flex; align-items: center; background: rgba(0, 0, 0, .706); border-radius: 2.4px; white-space: nowrap; }
	#modes { gap: 8px; }
	#modes button { display: flex; align-items: center; height: 24px; padding: 0; border: 0; background: none; color: #fff; font: 12px Chalet, sans-serif; cursor: pointer; }
	#modes button:disabled { cursor: default; }
	#modes button[hidden] { display: none; }
	#modes.ask button:not(:disabled) .ls-key { animation: ls-ask 1.2s ease-in-out infinite; }
	@keyframes ls-ask { 50% { opacity: .35; } }
	.ls-key { margin-left: 4px; min-width: 12px; height: 15px; padding: 0 4px; line-height: 16px; border-radius: 2px; background: #fff; color: #000; font-size: 10px; text-transform: uppercase; }
	/* Spinner SVG inline: sin dependencias externas */
	.ls-spin {
		flex: none; width: 22px; height: 22px; margin-left: 2px;
		background: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Ccircle cx='11' cy='11' r='9' fill='none' stroke='rgba(255,255,255,0.2)' stroke-width='2'/%3E%3Cpath d='M11 2 A9 9 0 0 1 20 11' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E") center / 22px 22px no-repeat;
		animation: ls-spin 1s linear infinite;
	}
	@keyframes ls-spin { to { transform: rotate(-360deg); } }
	#label { text-shadow: .85px .85px 1px rgba(0, 0, 0, .45); }
	#pct { margin-left: 15px; font-variant-numeric: tabular-nums; }
	#ls-log { position: absolute; left: 8px; right: 8px; bottom: 6px; display: flex; flex-direction: column; align-items: center; font: 10px/1.35 Consolas, monospace; color: rgba(190, 190, 190, .75); text-shadow: 0 0 2px #000, 1px 1px 1px #000; white-space: pre; pointer-events: none; }
	#console { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
	#data { color: #6a9; }
	#bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .08); }
	#fill { height: 100%; width: 0; background: linear-gradient(90deg, #7c5cff, #6ac3ff); box-shadow: 0 0 12px rgba(124, 92, 255, 0.7); }
	#hud { position: fixed; left: 8px; bottom: 8px; max-width: 60vw; white-space: pre-wrap; opacity: .8; pointer-events: none; }
	#fps { position: fixed; left: 8px; top: 6px; display: none; color: #0f0; font: bold 18px/1.2 Consolas, monospace; font-variant-numeric: tabular-nums; text-shadow: 1px 1px 2px #000, 0 0 3px #000; pointer-events: none; z-index: 10; }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="600" tabindex="-1"></canvas>
<div id="hud"></div>

<div id="loading">
  <div id="ls-stage">
    <div id="ls-screens">
      <div id="kito-bg">
        <div class="kito-grad"></div>
        <div class="kito-glow"></div>
        <div class="kito-grid"></div>
        <div class="kito-watermark">KITO</div>
        <div class="kito-particles">
          <span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="kito-scanlines"></div>
        <div class="kito-vignette"></div>
      </div>
    </div>

    <div id="kito-logo">KITO<small>WEB EDITION</small></div>

    <div id="ls-bars">
      <div id="modes" class="ls-bar">
        <button data-act="back"></button>
        <button data-act="map5"></button>
        <button data-act="map6"></button>
        <button data-act="sandbox"></button>
        <button data-act="story"></button>
      </div>
      <div class="ls-bar">
        <span id="label">Starting...</span>
        <span id="pct">0%</span>
        <i class="ls-spin"></i>
      </div>
    </div>
  </div>

  <div id="ls-log">
    <div id="data"></div>
    <div id="console"></div>
  </div>
  <div id="bar"><div id="fill"></div></div>
</div>

<div id="fps"></div>

<script type="module">
// ============================================================
// 0. SERVICE WORKER — imprescindible para COOP/COEP en GitHub Pages
//    GitHub Pages no permite cabeceras personalizadas; el SW las inyecta.
//    Esperamos a que controle la página; si es la primera visita, recargamos.
// ============================================================
if ('serviceWorker' in navigator) {
	try {
		await navigator.serviceWorker.register('/sw.js', { scope: '/' });
		await navigator.serviceWorker.ready;

		if (!navigator.serviceWorker.controller) {
			// Primera carga: el SW está registrado pero aún no controla este documento.
			// Sin un reload, crossOriginIsolated seguirá siendo false.
			if (!sessionStorage.getItem('sw_reloaded')) {
				sessionStorage.setItem('sw_reloaded', '1');
				location.reload();
				throw new Error('Reloading to activate Service Worker');
			}
		} else {
			sessionStorage.removeItem('sw_reloaded');
		}
	} catch (e) {
		console.warn('[SW] registration failed:', e);
	}
}

const q = new URLSearchParams(location.search);
// BASE vacío: todo (loader, workers, engine, shaders) se sirve desde la raíz de GitHub Pages.
const BASE = '';
const remoteLog = q.get('log') === '1';
const postLog = (text) => { if (remoteLog) fetch('/log', { method: 'POST', body: text }).catch(() => {}); };

// ---- Crash reports from the engine threads ----
{
	let posted = 0;
	new BroadcastChannel('game-crash').onmessage = (ev) => {
		const m = ev.data;
		const memory = /memory|OOM|Aborted\(|RangeError|grow/i.test(m.text);
		const dev = ' deviceMemory ' + (navigator.deviceMemory || '?') + ' GB, cores ' + navigator.hardwareConcurrency;
		if (remoteLog && posted++ < 3) fetch('/log', { method: 'POST', body: '[page] CRASH (' + m.kind + ', ' + m.thread + ' thread, wasm heap ' + m.heap + ' MB,' + dev + ', ' + location.search + '): ' + m.text + '\n' + m.tail.join('\n') + '\n' }).catch(() => {});
		const el = document.getElementById('hud');
		if (el) { el.textContent = 'The game stopped (' + m.kind + '): ' + m.text.split('\n')[0].slice(0, 200) + (memory ? ' - this looks like a lack of memory: close other tabs and reload.' : ' - reload the page.'); el.style.color = '#f96'; }
	};
}

// ---- Title stage: solo el "fit" del stage; el fondo es CSS puro ----
let stopTitle = () => {};
{
	const stage = document.getElementById('ls-stage');
	const fit = () => {
		const s = Math.min(innerWidth / 1280, innerHeight / 720);
		stage.style.transform = 'translate(' + (innerWidth - 1280 * s) / 2 + 'px,' + (innerHeight - 720 * s) / 2 + 'px) scale(' + s + ')';
	};
	fit();
	addEventListener('resize', fit);
}

// ---- Start choice: Story Mode / Sandbox Mode, y mapa de Sandbox ----
let startMode = q.get('mode') === 'story' ? 1 : q.get('mode') === 'sandbox' ? (q.get('map') === 'env_test' ? 3 : 2) : 0;
let startModeWord = null, startCommitted = false, pickingMap = false, waitingChoice = false;
const ACTS = {
	back: ['Back', 'Backspace', ['Backspace']],
	map5: ['GTA V Map', '5', ['Digit5', 'Numpad5']],
	map6: ['GTA VI Map', '6', ['Digit6', 'Numpad6']],
	sandbox: ['Sandbox Mode', 'Space', ['Space']],
	story: ['Story Mode', 'Enter', ['Enter', 'NumpadEnter']],
};
const LOADING = { 1: 'Loading Story Mode', 2: 'Loading Sandbox Mode: GTA V Map', 3: 'Loading Sandbox Mode: GTA VI Map' };
const modesEl = document.getElementById('modes'), modeButtons = [...modesEl.querySelectorAll('button')];
const isMode = (act) => act === 'story' || act === 'sandbox';
const showModes = () => {
	for (const b of modeButtons) {
		const act = b.dataset.act, loading = !pickingMap && (act === 'story' ? startMode === 1 : act === 'sandbox' && startMode >= 2);
		const text = document.createElement('span'), icon = document.createElement(loading ? 'i' : 'span');
		text.textContent = loading ? LOADING[startMode] : ACTS[act][0];
		icon.className = loading ? 'ls-spin' : 'ls-key';
		icon.textContent = loading ? '' : ACTS[act][1];
		b.replaceChildren(text, icon);
		b.style.order = loading ? 1 : 0;
		b.disabled = startCommitted;
		b.hidden = startCommitted ? !loading : pickingMap === isMode(act);
		b.classList.toggle('chosen', loading);
	}
	if (startMode) modesEl.classList.remove('ask');
	if (waitingChoice && !startMode) document.getElementById('label').textContent = pickingMap ? 'Choose a map to continue' : 'Choose Story Mode or Sandbox Mode to continue';
};
const choose = (m) => {
	pickingMap = false;
	if (m !== startMode) {
		startMode = m;
		if (startModeWord) Atomics.store(startModeWord, 0, m);
		postLog('[page] start mode: ' + ({ 1: 'story', 2: 'sandbox', 3: 'sandbox on env_test' })[m]);
	}
	showModes();
};
const act = (a) => {
	if (startCommitted) return;
	if (a === 'story') choose(1);
	else if (a === 'map5') choose(2);
	else if (a === 'map6') choose(3);
	else { pickingMap = a === 'sandbox'; showModes(); }
};
modesEl.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && !b.hidden) act(b.dataset.act); });
addEventListener('keydown', (e) => {
	if (startCommitted || e.ctrlKey || e.altKey || e.metaKey || !document.getElementById('loading')) return;
	const b = modeButtons.find((x) => !x.hidden && ACTS[x.dataset.act][2].includes(e.code));
	if (!b) return;
	act(b.dataset.act);
	e.preventDefault(); e.stopImmediatePropagation();
}, { capture: true });
showModes();

// ---- Loading progress ----
{
	const loading = document.getElementById('loading'), fill = document.getElementById('fill'), label = document.getElementById('label'), pct = document.getElementById('pct');
	let target = 0, shown = 0, ready = false, dirty = false, loadingGone = false;
	let dataBytes = 0, worldBase = -1;
	const samples = [];
	let lastLine = '';
	const consoleEl = document.getElementById('console');
	const bc = new BroadcastChannel('game-progress');
	let lastActivity = performance.now(), stallLogged = 0, lastLabel = '';
	bc.onmessage = (ev) => {
		const m = ev.data;
		lastActivity = performance.now();
		if (m.dl) { dataBytes += m.dl; samples.push([performance.now(), m.dl]); return; }
		if (m.lines) {
			if (loadingGone || !m.lines.length) return;
			lastLine = m.lines[m.lines.length - 1];
			dirty = true;
			return;
		}
		if (m.gpuLost) { hud.textContent = 'The graphics device was lost (' + m.gpuLost + '): the screen will stay black. Reload the page.'; hud.style.color = '#f66'; return; }
		if (m.error) { label.textContent = m.error; label.style.color = '#e66'; return; }
		if (m.pct > target) { target = m.pct; if (m.label) { lastLabel = m.label; if (!waitingChoice) label.textContent = m.label; } if (m.pct >= 72 && worldBase < 0) worldBase = dataBytes; }
		if (m.choice && !startMode) { waitingChoice = true; modesEl.classList.add('ask'); showModes(); }
		if (m.commit) { startCommitted = true; pickingMap = false; if (m.mode) startMode = m.mode; showModes(); }
		if (m.compiling !== undefined && !waitingChoice) { label.textContent = lastLabel = 'Preparing shaders'; target = Math.max(target, 99); }
		if (m.world) { ready = true; hud.textContent = 'click the game to capture the mouse (Esc releases it, Shift+P switches keyboard mode, = shows FPS)'; setTimeout(() => { hud.textContent = ''; }, 15000); }
	};
	const dataEl = document.getElementById('data');
	const WORLD_BYTES = 1.2e9;
	setInterval(() => {
		if (ready) return;
		if (waitingChoice) { if (!startMode) { lastActivity = performance.now(); return; } waitingChoice = false; label.textContent = lastLabel; }
		const quiet = (performance.now() - lastActivity) / 1000;
		if (quiet > 30) {
			label.textContent = 'No progress for ' + (quiet | 0) + ' s' + (lastLabel ? ' (last step: ' + lastLabel + ')' : '') + ': the device may be out of memory. Close other tabs, or reload.';
			label.style.color = '#e96';
			if (quiet - stallLogged > 30) { stallLogged = quiet; postLog('[page] STALL: no progress for ' + (quiet | 0) + ' s, last step "' + lastLabel + '", shown ' + shown.toFixed(0) + '%'); }
		} else if (stallLogged) { stallLogged = 0; label.style.color = ''; }
	}, 2000);
	const progressTimer = setInterval(() => {
		const now = performance.now();
		while (samples.length && now - samples[0][0] > 3000) samples.shift();
		const speed = samples.reduce((a, x) => a + x[1], 0) / 3;
		if (dataBytes) dataEl.textContent = 'Game data: ' + (dataBytes / 1048576 | 0) + ' MB' + (speed > 1e4 ? ' (' + (speed / 1048576).toFixed(1) + ' MB/s)' : '');
		if (worldBase >= 0 && !ready) target = Math.max(target, 72 + 26 * Math.min(1, (dataBytes - worldBase) / WORLD_BYTES));
		const cap = ready ? 100 : Math.min(99, target + 6);
		const goal = ready ? 100 : (shown < target ? target : cap);
		shown += (goal - shown) * (goal === target || ready ? 0.12 : 0.004);
		if (dirty) { dirty = false; consoleEl.textContent = lastLine; }
		fill.style.width = shown.toFixed(1) + '%';
		pct.textContent = Math.round(shown) + '%';
		if (ready && shown > 99.5) { loading.classList.add('done'); setTimeout(() => { loading.remove(); stopTitle(); }, 1000); loadingGone = true; clearInterval(progressTimer); }
	}, 50);
}
const hud = document.getElementById('hud');

// ---- FPS counter ----
{
	const el = document.getElementById('fps');
	let on = false;
	new BroadcastChannel('game-fps').onmessage = (ev) => { if (on) el.textContent = Math.round(ev.data.fps) + ' FPS'; };
	const isToggle = (e) => e.code === 'Equal' && !e.ctrlKey && !e.altKey && !e.metaKey;
	addEventListener('keydown', (e) => {
		if (!isToggle(e)) return;
		e.stopImmediatePropagation(); e.preventDefault();
		if (e.repeat) return;
		on = !on;
		el.style.display = on ? 'block' : 'none';
		if (on) el.textContent = '-- FPS';
	}, { capture: true });
	addEventListener('keyup', (e) => { if (isToggle(e)) { e.stopImmediatePropagation(); e.preventDefault(); } }, { capture: true });
}

const canvas = document.getElementById('canvas');

if (remoteLog) {
	const queue = [];
	let sending = false;
	const pump = async () => {
		if (sending || !queue.length) return;
		sending = true;
		const body = queue.splice(0).join('\n');
		try { await fetch('/log', { method: 'POST', body, keepalive: body.length < 60000 }); } catch (e) { }
		sending = false;
		pump();
	};
	new BroadcastChannel('game-log').onmessage = (ev) => { queue.push(ev.data); if (queue.length > 20000) queue.splice(0, queue.length - 20000); pump(); };
}
addEventListener('pagehide', () => { try { new BroadcastChannel('game-io').postMessage('close'); } catch (e) {} });

let lowMemory = false;
let startSize = [1280, 720], wantSize = null;
if (!crossOriginIsolated) {
	document.getElementById('label').textContent = 'not cross-origin isolated: the Service Worker must be active and injecting COOP/COEP. Reload the page.';
	document.getElementById('label').style.color = '#e66';
} else {
	const offscreen = canvas.transferControlToOffscreen();
	const lowParam = q.get('low');
	lowMemory = lowParam === '1' || (lowParam !== '0' && navigator.deviceMemory && navigator.deviceMemory <= 4);
	const LOW_ARGS = ['-textureQuality=0', '-pedVariety=0', '-vehicleVariety=0', '-shadowQuality=' + (q.get('shadows') === '1' ? 0 : -1), '-reflectionQuality=0', '-particleQuality=0',
		'-grassQuality=0', '-cityDensity=0', '-lodScale=0', '-pedLodBias=0', '-vehicleLodBias=0'];
	const cores = +(q.get('cores') || 0) || (lowMemory ? 2 : navigator.hardwareConcurrency);
	if (lowMemory) hud.textContent = 'Low-memory device (' + (navigator.deviceMemory || '?') + ' GB reported): close other tabs. If the tab shows "Aw, Snap!" or SIGILL it ran out of memory.';
	postLog('[page env] ' + JSON.stringify({ deviceMemory: navigator.deviceMemory, cores: navigator.hardwareConcurrency, usingCores: cores, low: lowMemory, isolated: crossOriginIsolated, ua: navigator.userAgent.slice(0, 120), screen: screen.width + 'x' + screen.height + '@' + devicePixelRatio }));
	wantSize = () => {
		const forced = /^(\d+)x(\d+)$/.exec(q.get('res') || '');
		if (forced) return [+forced[1], +forced[2]];
		const sc = Math.max(0.25, Math.min(2, +(q.get('scale') || 1)));
		let w = innerWidth * devicePixelRatio * sc, h = innerHeight * devicePixelRatio * sc;
		const cap = lowMemory ? [2560, 1440] : [3840, 2160], k = Math.min(1, cap[0] / w, cap[1] / h);
		w *= k; h *= k;
		return [Math.max(320, Math.round(w / 2) * 2), Math.max(240, Math.round(h / 2) * 2)];
	};
	startSize = wantSize();
	const LOG_ARGS = q.get('verbose') ? [] : ['-Script_all=warning', '-replay_all=warning'];
	const ENGINE_ARGS = ['-fastscriptcore'];
	setInterval(() => {}, 1);
	const worker = new Worker(BASE + '/loader.js');
	worker.onmessage = (ev) => {
		if (ev.data.hud) hud.textContent = ev.data.hud;
		if (ev.data.input) installInput(ev.data.input.memory, ev.data.input.block);
		if (ev.data.audio) { audioPending = ev.data.audio; tryStartAudio(); }
	};
	worker.onerror = (e) => { hud.textContent = 'worker error: ' + e.message; };
	worker.postMessage({
		canvas: offscreen,
		base: BASE,
		args: ['-rootdir=/game/', ...(q.get('nogpu') ? [] : ['-wgpu']), '-nodisplaycalibration', '-noSocialClub', '-pc:nosocialclub', ...(q.get('newgame') === '1' ? ['-noautoload'] : []), '-nonetwork', '-output', '-width=' + startSize[0], '-height=' + startSize[1], '-forceResolution', ...LOG_ARGS, ...ENGINE_ARGS, '-frameLimit=' + (q.get('fps') === '30' ? 2 : q.get('fps') === '0' ? 0 : 1),
		 ...(cores <= 2 ? ['-numCores=' + cores] : []), ...(lowMemory ? LOW_ARGS : []), ...(q.get('args') || '').split(',').filter(Boolean)],
		shotEvery: +(q.get('shot') || 0),
		shotRt: q.get('shotrt') === '1',
		noHints: q.get('nohints') === '1',
		noPack: q.get('nopack') === '1',
		gpuLimits: q.get('limits') || '',
		keepThreads: (q.get('keep') || '').split(',').reduce((m, g) => m | ({ replay: 1, net: 2, bink: 4, idle: 8 }[g] || 0), 0),
		cores,
		noStore: !!(q.get('nocache') || q.get('nosw')),
		fullConsole: !!q.get('console'),
		remoteLog,
		trace: !!q.get('trace'),
		slots: +(q.get('slots') || 0),
		syncPipelines: !!q.get('syncpipelines'),
		record: !!q.get('record'),
		lowMemory,
	}, [offscreen]);
}

if (remoteLog && (q.get('mem') || lowMemory) && performance.measureUserAgentSpecificMemory) {
	const report = async () => {
		try {
			const r = await performance.measureUserAgentSpecificMemory();
			const rows = r.breakdown.filter((b) => b.bytes > 1e6).map((b) => (b.bytes / 1048576 | 0) + ' MB ' + (b.types || []).join('+') + ' ' + (b.attribution || []).map((a) => (a.url || '').split('/').pop() + '/' + (a.scope || '')).join(','));
			postLog('[page mem] total ' + (r.bytes / 1048576 | 0) + ' MB; ' + rows.join(' | '));
		} catch (e) { postLog('[page mem] failed: ' + e); }
		setTimeout(report, 15000);
	};
	setTimeout(report, 15000);
}

// ---- Audio ----
let audioPending = null, audioGesture = false, audioStarted = false;
function tryStartAudio() {
	if (!audioPending || !audioGesture || audioStarted) return;
	audioStarted = true;
	(async () => {
		try {
			const ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
			await ctx.audioWorklet.addModule(BASE + '/audio-worklet.js');
			const node = new AudioWorkletNode(ctx, 'game-audio', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2], processorOptions: audioPending });
			node.connect(ctx.destination);
			await ctx.resume();
			addEventListener('pointerdown', () => ctx.resume());
			addEventListener('keydown', () => ctx.resume());
			if (q.get('mem')) {
				const hdr = new Int32Array(audioPending.memory.buffer, audioPending.ring, 8);
				setInterval(() => postLog('[page audio] state ' + ctx.state + ', frames written ' + (hdr[0] >>> 0) + ', read ' + (hdr[1] >>> 0) + ', fill ' + (((hdr[0] - hdr[1]) >>> 0)) + ', worklet calls ' + (hdr[3] >>> 0) + ', peak ' + (Atomics.exchange(hdr, 4, 0) / 1e6).toFixed(3)), 5000);
			}
			postLog('[page] audio started: ' + ctx.sampleRate + ' Hz, base latency ' + ctx.baseLatency);
		} catch (e) { audioStarted = false; postLog('[page] audio failed: ' + e); }
	})();
}
for (const type of ['pointerdown', 'keydown']) addEventListener(type, () => { audioGesture = true; tryStartAudio(); }, { capture: true });

// ---- Input ----
const VK = {
	Backspace: 0x08, Tab: 0x09, Enter: 0x0D, NumpadEnter: 0xFD, Pause: 0x13, CapsLock: 0x14, Escape: 0x1B, Space: 0x20, PageUp: 0x21, PageDown: 0x22,
	End: 0x23, Home: 0x24, ArrowLeft: 0x25, ArrowUp: 0x26, ArrowRight: 0x27, ArrowDown: 0x28, PrintScreen: 0x2C, Insert: 0x2D, Delete: 0x2E,
	MetaLeft: 0x5B, MetaRight: 0x5C, ContextMenu: 0x5D, NumpadMultiply: 0x6A, NumpadAdd: 0x6B, NumpadSubtract: 0x6D, NumpadDecimal: 0x6E, NumpadDivide: 0x6F,
	NumLock: 0x90, ScrollLock: 0x91, ShiftLeft: 0xA0, ShiftRight: 0xA1, ControlLeft: 0xA2, ControlRight: 0xA3, AltLeft: 0xA4, AltRight: 0xA5,
	Semicolon: 0xBA, Equal: 0xBB, Comma: 0xBC, Minus: 0xBD, Period: 0xBE, Slash: 0xBF, Backquote: 0xC0, BracketLeft: 0xDB, Backslash: 0xDC, BracketRight: 0xDD,
	Quote: 0xDE, IntlBackslash: 0xE2,
};
for (let i = 0; i < 10; i++) { VK['Digit' + i] = 0x30 + i; VK['Numpad' + i] = 0x60 + i; }
for (let i = 0; i < 26; i++) VK['Key' + String.fromCharCode(65 + i)] = 0x41 + i;
for (let i = 1; i <= 24; i++) VK['F' + i] = 0x6F + i;

function installDebugPanel(memory, block) {
	const dbg = new Int32Array(memory.buffer, block + 424, 2);
	const panel = document.createElement('div');
	panel.style.cssText = 'position:fixed;left:0;top:0;right:0;background:#000c;color:#8f8;font:12px monospace;padding:4px 8px;z-index:9;white-space:pre-wrap;pointer-events:none';
	document.body.appendChild(panel);
	let last = '', total = 0;
	new BroadcastChannel('game-debug').onmessage = (ev) => { last = ev.data.last; total = ev.data.total; render(); };
	const render = () => { const n = Atomics.load(dbg, 0); panel.textContent = 'DRAW ISOLATION  limit ' + (n < 0 ? 'off (all)' : n) + ' of ' + total + ' draws/frame   [F1 -1  F2 +1  F3 -25  F4 +25  F5 all  F6 log]\nlast draw run: ' + (last || '-'); };
	addEventListener('keydown', (e) => {
		const step = { F1: -1, F2: 1, F3: -25, F4: 25 }[e.code];
		if (step !== undefined) {
			const n = Atomics.load(dbg, 0);
			Atomics.store(dbg, 0, Math.max(0, Math.min(total, (n < 0 ? total : n) + step)));
			e.preventDefault(); render();
		} else if (e.code === 'F5' && !e.ctrlKey) { Atomics.store(dbg, 0, -1); e.preventDefault(); render(); }
		else if (e.code === 'F6') { postLog('[debug draw] limit ' + Atomics.load(dbg, 0) + ' of ' + total + ' | ' + last); e.preventDefault(); }
	}, { capture: true });
	render();
}

function installInput(memory, block) {
	if (q.get('dbg')) installDebugPanel(memory, block);
	const keys = new Uint8Array(memory.buffer, block, 256);
	const w = new Int32Array(memory.buffer, block + 256, 10);
	const U16 = new Uint16Array(memory.buffer, block + 256 + 40, 64);
	const MX = 0, MY = 1, DX = 2, DY = 3, DZ = 4, BTN = 5, FOCUS = 6, LOCKED = 7, HEAD = 8, TAIL = 9;
	let W = startSize[0], H = startSize[1];
	const ext = new Int32Array(memory.buffer, block + 424, 4);
	startModeWord = new Int32Array(memory.buffer, block + 440, 1);
	if (startMode) Atomics.store(startModeWord, 0, startMode);
	Atomics.store(ext, 2, W); Atomics.store(ext, 3, H);
	if (!q.get('fixed')) {
		let timer = 0;
		addEventListener('resize', () => {
			clearTimeout(timer);
			timer = setTimeout(() => {
				const [w, h] = wantSize();
				if (w === W && h === H) return;
				W = w; H = h;
				Atomics.store(ext, 2, w); Atomics.store(ext, 3, h);
				trace('window resized: back buffer ' + w + 'x' + h);
			}, 150);
		});
	}
	Atomics.store(w, FOCUS, document.hasFocus() ? 1 : 0);
	Atomics.store(w, MX, W >> 1);
	Atomics.store(w, MY, H >> 1);

	let traced = 0;
	const trace = (msg) => { if (traced < 80) { traced++; postLog('[page input] ' + msg); } };
	const passThrough = (e) => e.code === 'F12' || e.code === 'F11' || (e.ctrlKey && e.shiftKey && (e.code === 'KeyI' || e.code === 'KeyJ')) || e.code === 'F5';
	const FLY_ALIAS = { KeyI: 'Numpad8', KeyK: 'Numpad2', KeyJ: 'Numpad4', KeyL: 'Numpad6', KeyU: 'Numpad7', KeyO: 'Numpad9' };
	const held = new Set();
	const syncFlyAlias = () => { for (const [src, target] of Object.entries(FLY_ALIAS)) Atomics.store(keys, VK[target], held.has(src) || held.has(target) ? 0x80 : 0); };
	addEventListener('keydown', (e) => {
		if (passThrough(e)) return;
		e.preventDefault();
		const vk = VK[e.code];
		if (!e.repeat) trace('keydown ' + e.code + ' vk=' + (vk || 'UNMAPPED') + ' hasFocus=' + document.hasFocus() + ' engineFocus=' + Atomics.load(w, FOCUS));
		if (vk) Atomics.store(keys, vk, 0x80);
		held.add(e.code); syncFlyAlias();
		if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
			const head = Atomics.load(w, HEAD);
			if (((head - Atomics.load(w, TAIL)) >>> 0) < 64) { U16[head & 63] = e.key.charCodeAt(0); Atomics.store(w, HEAD, (head + 1) | 0); }
		} else if (e.code === 'Backspace' || e.code === 'Enter') {
			const head = Atomics.load(w, HEAD);
			if (((head - Atomics.load(w, TAIL)) >>> 0) < 64) { U16[head & 63] = e.code === 'Enter' ? 13 : 8; Atomics.store(w, HEAD, (head + 1) | 0); }
		}
	});
	addEventListener('keyup', (e) => {
		if (passThrough(e)) return;
		e.preventDefault();
		const vk = VK[e.code];
		if (vk) Atomics.store(keys, vk, 0);
		held.delete(e.code); syncFlyAlias();
	});
	const releaseAll = () => { held.clear(); for (let i = 0; i < 256; i++) Atomics.store(keys, i, 0); Atomics.store(w, BTN, 0); };
	addEventListener('focus', () => { trace('window focus'); Atomics.store(w, FOCUS, 1); });
	addEventListener('blur', () => { trace('window blur (all keys released)'); Atomics.store(w, FOCUS, 0); releaseAll(); });

	const locked = () => document.pointerLockElement === canvas;
	canvas.addEventListener('mousedown', (e) => {
		if (!locked()) { canvas.requestPointerLock({ unadjustedMovement: true }).catch(() => canvas.requestPointerLock()); }
		Atomics.or(w, BTN, 1 << [0, 2, 1, 3, 4][e.button]);
		e.preventDefault();
	});
	addEventListener('mouseup', (e) => { Atomics.and(w, BTN, ~(1 << [0, 2, 1, 3, 4][e.button])); });
	addEventListener('contextmenu', (e) => e.preventDefault());
	document.addEventListener('pointerlockchange', () => { trace('pointer lock ' + (locked() ? 'on' : 'off')); Atomics.store(w, LOCKED, locked() ? 1 : 0); });
	addEventListener('mousemove', (e) => {
		const r = canvas.getBoundingClientRect();
		if (locked()) {
			Atomics.add(w, DX, e.movementX);
			Atomics.add(w, DY, e.movementY);
			const x = Math.max(0, Math.min(W - 1, Atomics.load(w, MX) + e.movementX));
			const y = Math.max(0, Math.min(H - 1, Atomics.load(w, MY) + e.movementY));
			Atomics.store(w, MX, x);
			Atomics.store(w, MY, y);
		} else {
			const x = Math.max(0, Math.min(W - 1, Math.round((e.clientX - r.left) * W / r.width)));
			const y = Math.max(0, Math.min(H - 1, Math.round((e.clientY - r.top) * H / r.height)));
			Atomics.add(w, DX, x - Atomics.load(w, MX));
			Atomics.add(w, DY, y - Atomics.load(w, MY));
			Atomics.store(w, MX, x);
			Atomics.store(w, MY, y);
		}
	});
	let wheelAccum = 0;
	addEventListener('wheel', (e) => {
		e.preventDefault();
		wheelAccum += -e.deltaY / (e.deltaMode === 0 ? 100 : e.deltaMode === 1 ? 3 : 1);
		const n = Math.trunc(wheelAccum);
		if (n) { wheelAccum -= n; Atomics.add(w, DZ, n); }
	}, { passive: false });
}
</script>
</body>
