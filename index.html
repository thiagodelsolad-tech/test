<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<style>
	* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
	html, body { margin: 0; height: 100%; background: #000; color: #ccc;
		font: 12px 'Consolas','Menlo',monospace; overflow: hidden;
		-webkit-user-select: none; user-select: none; touch-action: none;
		overscroll-behavior: none; }
	#canvas { display: block; position: absolute; left: 0; top: 0;
		width: 100vw; height: 100vh; background: #000; touch-action: none; }

	/* ==================== DEVICE SELECT ==================== */
	#device-select {
		position: fixed; inset: 0; z-index: 6000;
		background: radial-gradient(ellipse at center, #0a0618 0%, #000 100%);
		display: flex; flex-direction: column; align-items: center; justify-content: center;
		padding: 20px; touch-action: manipulation; overflow-y: auto;
	}
	#device-select.hidden { display: none; }
	#device-select .ds-title {
		font-family: 'Arial Black', sans-serif; font-size: 54px; font-weight: 900;
		letter-spacing: 14px; color: #fff; margin-bottom: 6px;
		text-shadow: 0 0 20px rgba(180,120,255,0.7);
	}
	#device-select .ds-sub {
		font-size: 11px; letter-spacing: 6px; color: rgba(200,200,255,0.5);
		text-transform: uppercase; margin-bottom: 32px;
	}
	#device-select .ds-cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
	#device-select .ds-card {
		position: relative; width: 200px; padding: 28px 20px;
		background: rgba(20,15,40,0.6);
		border: 2px solid rgba(150,150,255,0.25);
		border-radius: 12px; cursor: pointer;
		display: flex; flex-direction: column; align-items: center;
		color: #cdd6f4; font-family: 'Consolas', monospace;
		touch-action: manipulation; -webkit-appearance: none; appearance: none;
		transition: all 0.15s;
	}
	#device-select .ds-card:active { transform: scale(0.97); background: rgba(120,90,255,0.25); }
	#device-select .ds-card.detected { border-color: #7cffb2; box-shadow: 0 0 24px rgba(124,255,178,0.25); }
	#device-select .ds-card.detected::before {
		content: '✓ detectado'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
		background: #0a0618; padding: 2px 8px; font-size: 9px; letter-spacing: 2px; color: #7cffb2;
	}
	#device-select .ds-icon { font-size: 48px; margin-bottom: 12px; }
	#device-select .ds-name { font-size: 14px; font-weight: 700; letter-spacing: 2px; }
	#device-select .ds-detail { font-size: 10px; color: rgba(180,180,220,0.6); margin-top: 8px; text-align: center; }

	/* ==================== GRAPHICS PANEL ==================== */
	#graphics-panel {
		width: 100%; max-width: 460px; margin-top: 32px;
		background: rgba(0,0,0,0.5);
		border: 1px solid rgba(150,150,255,0.2);
		border-radius: 10px;
		padding: 18px 20px;
		font-family: 'Consolas', monospace;
		display: none;
	}
	#graphics-panel.visible { display: block; }
	#graphics-panel .gp-title {
		font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
		color: #a78bfa; margin-bottom: 14px; padding-bottom: 8px;
		border-bottom: 1px solid rgba(150,150,255,0.15);
	}
	#graphics-panel .gp-row {
		display: flex; align-items: center; justify-content: space-between;
		margin-bottom: 12px; gap: 12px; flex-wrap: wrap;
	}
	#graphics-panel .gp-row:last-child { margin-bottom: 0; }
	#graphics-panel .gp-label {
		font-size: 11px; color: #7c8bd4; letter-spacing: 1px;
		min-width: 110px;
	}
	#graphics-panel .gp-controls { display: flex; gap: 6px; flex-wrap: wrap; }
	#graphics-panel .gp-btn {
		padding: 7px 12px;
		background: rgba(20,15,40,0.7);
		border: 1px solid rgba(150,150,255,0.3);
		border-radius: 5px;
		color: #cdd6f4;
		font-family: 'Consolas', monospace;
		font-size: 11px;
		cursor: pointer;
		touch-action: manipulation;
		-webkit-appearance: none; appearance: none;
		transition: all 0.12s;
	}
	#graphics-panel .gp-btn:active { transform: scale(0.95); }
	#graphics-panel .gp-btn.active {
		background: rgba(120,90,255,0.5);
		border-color: #a78bfa;
		color: #fff;
		box-shadow: 0 0 10px rgba(180,120,255,0.4);
	}

	/* ==================== CLICK TO START ==================== */
	#click-to-start {
		position: fixed; inset: 0; z-index: 5000;
		background: radial-gradient(ellipse at center, #0a0618 0%, #000 100%);
		display: flex; flex-direction: column; align-items: center; justify-content: center;
		padding: 20px; touch-action: manipulation;
	}
	#click-to-start.hidden { display: none; }
	#click-to-start .cts-logo {
		font-family: 'Arial Black', sans-serif; font-size: 82px; font-weight: 900;
		letter-spacing: 14px; color: #fff; margin-bottom: 12px;
		text-shadow: 0 0 20px rgba(180,120,255,0.9);
		animation: cts-glow 3s ease-in-out infinite;
	}
	@keyframes cts-glow {
		0%, 100% { text-shadow: 0 0 20px rgba(180,120,255,0.9), 0 0 60px rgba(120,180,255,0.5); }
		50%      { text-shadow: 0 0 40px rgba(180,120,255,1), 0 0 100px rgba(120,180,255,0.8); }
	}
	#click-to-start .cts-sub {
		font-size: 12px; letter-spacing: 12px; text-transform: uppercase;
		color: rgba(200,200,255,0.5); margin-bottom: 60px;
	}
	#cts-button {
		background: rgba(120,90,255,0.2); border: 2px solid #a78bfa; color: #fff;
		font-family: 'Arial Black', sans-serif; font-size: 18px; letter-spacing: 4px;
		padding: 20px 48px; border-radius: 8px; cursor: pointer;
		animation: cts-pulse 2s ease-in-out infinite;
		touch-action: manipulation;
	}
	#cts-button:active { background: rgba(120,90,255,0.5); transform: scale(0.97); }
	@keyframes cts-pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
	@media (max-width: 600px) {
		#click-to-start .cts-logo { font-size: 56px; letter-spacing: 10px; }
		#cts-button { font-size: 15px; padding: 16px 32px; }
	}

	#sound-toggle {
		position: fixed; top: max(24px, env(safe-area-inset-top)); right: max(24px, env(safe-area-inset-right));
		width: 44px; height: 44px;
		background: rgba(0,0,0,0.65); border: 1px solid rgba(180,120,255,0.4);
		border-radius: 50%; color: #a78bfa; font-size: 18px; cursor: pointer; z-index: 100;
		display: flex; align-items: center; justify-content: center;
		touch-action: manipulation;
	}
	#sound-toggle.muted { color: rgba(150,150,200,0.4); }

	/* ==================== BOOT ==================== */
	#boot-screen {
		position: fixed; inset: 0; background: #05060a; z-index: 1000;
		display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
	}
	#boot-screen.visible { display: flex; }
	#boot-screen .boot-spinner {
		width: 64px; height: 64px; border: 3px solid rgba(120,100,255,0.15);
		border-top-color: #a78bfa; border-radius: 50%;
		animation: boot-spin 1s linear infinite; margin-bottom: 24px;
	}
	@keyframes boot-spin { to { transform: rotate(360deg); } }
	#boot-screen .boot-title {
		font-family: 'Arial Black', sans-serif; font-size: 28px; font-weight: 900;
		letter-spacing: 12px; color: #fff; margin-bottom: 8px;
		text-shadow: 0 0 20px rgba(180,120,255,0.6);
	}
	#boot-screen .boot-sub {
		font-size: 10px; letter-spacing: 6px; text-transform: uppercase;
		color: rgba(200,200,255,0.5); margin-bottom: 40px;
	}
	#boot-screen .boot-status {
		font-size: 11px; letter-spacing: 2px; color: rgba(180,180,220,0.7);
		min-height: 16px; text-align: center; max-width: 90vw;
	}
	#boot-screen .boot-bar {
		width: 240px; height: 2px; background: rgba(150,150,255,0.12);
		border-radius: 1px; margin-top: 16px; overflow: hidden;
	}
	#boot-screen .boot-bar-fill {
		height: 100%; width: 0%;
		background: linear-gradient(90deg, #7c5cff, #6ac3ff);
		transition: width 0.4s ease-out;
	}

	/* ==================== LOADING ==================== */
	#loading { position: fixed; inset: 0; background: #000; overflow: hidden; z-index: 5; opacity: 0; }
	#loading.done { opacity: 0; pointer-events: none; }
	#loading.visible { opacity: 1; }
	#ls-stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px;
		transform-origin: 0 0; overflow: hidden; font: 12px sans-serif; color: #fff; }
	#ls-screens { position: absolute; inset: 0; overflow: hidden; }
	.ls-screen { position: absolute; inset: 0; will-change: transform; }
	.ls-screen .screen-bg { position: absolute; inset: 0; }
	.screen-1 .screen-bg { background: radial-gradient(ellipse at 30% 40%, rgba(255,140,60,0.5) 0%, transparent 55%), radial-gradient(ellipse at 70% 80%, rgba(180,60,100,0.4) 0%, transparent 60%), linear-gradient(180deg, #1a0e1e 0%, #2d1220 50%, #0a0608 100%); }
	.screen-2 .screen-bg { background: radial-gradient(ellipse at 20% 70%, rgba(0,180,220,0.5) 0%, transparent 50%), radial-gradient(ellipse at 80% 30%, rgba(120,40,200,0.4) 0%, transparent 55%), linear-gradient(180deg, #050a18 0%, #0a1428 50%, #020408 100%); }
	.screen-3 .screen-bg { background: radial-gradient(circle at 50% 50%, rgba(255,200,100,0.35) 0%, transparent 40%), radial-gradient(ellipse at 20% 80%, rgba(200,60,60,0.4) 0%, transparent 50%), linear-gradient(180deg, #1a0e08 0%, #2a1408 60%, #0a0402 100%); }
	.screen-4 .screen-bg { background: radial-gradient(ellipse at 70% 30%, rgba(80,255,160,0.4) 0%, transparent 50%), radial-gradient(ellipse at 30% 70%, rgba(40,100,180,0.4) 0%, transparent 55%), linear-gradient(180deg, #021a0e 0%, #051428 50%, #020204 100%); }
	.screen-5 .screen-bg { background: radial-gradient(ellipse at 50% 20%, rgba(255,60,60,0.4) 0%, transparent 50%), radial-gradient(ellipse at 50% 90%, rgba(60,20,100,0.5) 0%, transparent 55%), linear-gradient(180deg, #1a0508 0%, #0a0518 60%, #000 100%); }
	.screen-6 .screen-bg { background: radial-gradient(ellipse at 30% 50%, rgba(255,200,255,0.3) 0%, transparent 45%), radial-gradient(ellipse at 70% 50%, rgba(100,180,255,0.3) 0%, transparent 45%), linear-gradient(180deg, #0a0814 0%, #180a24 50%, #05030a 100%); }
	.screen-7 .screen-bg { background: radial-gradient(ellipse at 60% 40%, rgba(255,100,200,0.4) 0%, transparent 45%), radial-gradient(ellipse at 40% 60%, rgba(100,200,255,0.4) 0%, transparent 50%), linear-gradient(180deg, #0a0416 0%, #1a0828 50%, #05020a 100%); }
	.screen-8 .screen-bg { background: radial-gradient(ellipse at 30% 40%, rgba(255,180,60,0.4) 0%, transparent 50%), radial-gradient(ellipse at 70% 70%, rgba(200,40,120,0.4) 0%, transparent 55%), linear-gradient(180deg, #1a1008 0%, #1a0818 60%, #050205 100%); }
	.screen-label {
		position: absolute; left: 80px; bottom: 180px;
		font-family: 'Arial Black', sans-serif; font-size: 44px; font-weight: 900;
		letter-spacing: 8px; color: rgba(255,255,255,0.9);
		text-shadow: 0 4px 20px rgba(0,0,0,0.9);
	}
	.screen-label small {
		display: block; font-size: 11px; font-weight: 400; letter-spacing: 6px;
		margin-top: 6px; color: rgba(255,255,255,0.5);
	}
	#kito-logo { position: absolute; left: 60px; top: 60px;
		font-family: 'Arial Black',sans-serif; font-size: 52px; font-weight: 900;
		letter-spacing: 10px; color: #fff;
		text-shadow: 0 0 12px rgba(180,120,255,.9), 0 0 30px rgba(120,180,255,.6);
		pointer-events: none; z-index: 10; }
	#kito-logo small { display: block; font-size: 10px; letter-spacing: 10px;
		margin-top: 4px; color: rgba(255,255,255,.7); text-shadow: none; font-weight: 400; }

	#ls-bars { position: absolute; right: 96px; top: 642px; display: flex; gap: 3px; z-index: 15; }
	.ls-bar { height: 24px; padding: 0 6px; display: flex; align-items: center;
		background: rgba(0,0,0,.7); border-radius: 2.4px; white-space: nowrap; }
	#modes { gap: 8px; }
	#modes button { display: flex; align-items: center; height: 24px; padding: 0 8px;
		border: 0; background: none; color: #fff; font: 12px sans-serif; cursor: pointer; }
	#modes button[hidden] { display: none; }
	#label { text-shadow: .85px .85px 1px rgba(0,0,0,.45); }
	#pct { margin-left: 15px; font-variant-numeric: tabular-nums; }

	#ls-log { position: absolute; left: 8px; right: 8px; bottom: 6px; display: flex;
		flex-direction: column; align-items: center; font: 10px/1.35 Consolas,monospace;
		color: rgba(190,190,190,.75); text-shadow: 0 0 2px #000;
		white-space: pre; pointer-events: none; z-index: 15; }
	#console { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
	#data { color: #6a9; }
	#bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
		background: rgba(255,255,255,.08); z-index: 15; }
	#fill { height: 100%; width: 0;
		background: linear-gradient(90deg, #7c5cff, #6ac3ff);
		box-shadow: 0 0 12px rgba(124,92,255,.7); }

	#hud { position: fixed; left: 8px; bottom: 8px; max-width: 90vw;
		white-space: pre-wrap; opacity: .85; pointer-events: none;
		font: 11px Consolas,monospace; color: #9ad; z-index: 20; }

	/* ==================== STALL OVERLAY ==================== */
	#stall-overlay {
		position: fixed; inset: 0; z-index: 4400;
		background: rgba(0,0,0,0.9);
		backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
		display: none; flex-direction: column; align-items: center; justify-content: center;
		padding: 24px; gap: 16px; text-align: center;
	}
	#stall-overlay.visible { display: flex; }
	#stall-overlay .so-title {
		font-family: 'Arial Black', sans-serif; font-size: 20px; font-weight: 900;
		letter-spacing: 3px; color: #ffb37c;
	}
	#stall-overlay .so-phase {
		font-size: 12px; letter-spacing: 2px; color: #fff;
		background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 6px;
	}
	#stall-overlay .so-msg {
		max-width: 500px; font-size: 12px; line-height: 1.6;
		color: rgba(200,200,220,0.85);
	}
	#stall-overlay .so-msg b { color: #ffb37c; }
	#stall-overlay .so-actions {
		display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
		margin-top: 8px;
	}
	#stall-overlay button {
		padding: 14px 24px;
		background: rgba(120,90,255,0.2);
		border: 1px solid #a78bfa; color: #fff;
		font-family: 'Consolas', monospace;
		font-size: 12px; letter-spacing: 2px;
		border-radius: 6px; cursor: pointer;
		touch-action: manipulation; -webkit-appearance: none; appearance: none;
	}
	#stall-overlay button:active { background: rgba(120,90,255,0.5); }
	#stall-overlay button.danger {
		border-color: #ff7c7c; background: rgba(255,120,120,0.1);
	}
	#stall-overlay button.danger:active { background: rgba(255,120,120,0.3); }

	/* ==================== MOBILE MODES ==================== */
	#mobile-modes {
		position: fixed; inset: 0; z-index: 4500;
		background: rgba(0,0,0,0.88);
		backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
		display: none; flex-direction: column; align-items: center; justify-content: center;
		padding: 20px; gap: 14px;
		touch-action: manipulation;
	}
	#mobile-modes.visible { display: flex; }
	#mobile-modes .mm-title {
		font-family: 'Arial Black', sans-serif; font-size: 18px; font-weight: 900;
		letter-spacing: 4px; color: #fff; margin-bottom: 12px; text-align: center;
		text-shadow: 0 0 12px rgba(180,120,255,0.6);
	}
	#mobile-modes .mm-btn {
		width: 100%; max-width: 400px;
		padding: 22px 24px;
		background: rgba(20,15,40,0.7);
		border: 2px solid rgba(150,150,255,0.35);
		border-radius: 12px;
		color: #fff;
		font-family: 'Arial Black', sans-serif;
		font-size: 16px; letter-spacing: 2px;
		cursor: pointer; text-align: left;
		touch-action: manipulation;
		transition: all 0.15s;
	}
	#mobile-modes .mm-btn:active {
		background: rgba(120,90,255,0.55);
		border-color: #a78bfa;
		transform: scale(0.98);
	}
	#mobile-modes .mm-btn .mm-desc {
		display: block; font-family: 'Consolas', monospace;
		font-size: 10px; color: rgba(200,200,255,0.55);
		letter-spacing: 1px; margin-top: 4px; font-weight: 400;
	}

	/* ==================== TOUCH ==================== */
	#touch-ui { position: fixed; inset: 0; z-index: 4000; pointer-events: none; display: none; touch-action: none; }
	#touch-ui.active { display: block; }
	#touch-look { position: absolute; left: 50%; right: 0; top: 0; bottom: 0; z-index: 0; pointer-events: auto; touch-action: none; }
	#touch-stick {
		position: absolute;
		left: max(20px, env(safe-area-inset-left));
		bottom: max(20px, env(safe-area-inset-bottom));
		width: 150px; height: 150px;
		border-radius: 50%;
		background: rgba(0,0,0,0.32);
		border: 2px solid rgba(150,150,255,0.35);
		z-index: 10; pointer-events: auto;
		display: flex; align-items: center; justify-content: center;
		touch-action: none;
	}
	#touch-stick-knob {
		position: absolute; left: 50%; top: 50%;
		width: 58px; height: 58px; border-radius: 50%;
		background: radial-gradient(circle, rgba(180,120,255,0.8) 0%, rgba(120,90,255,0.6) 100%);
		transform: translate(-50%, -50%);
		pointer-events: none;
	}
	.touch-btn {
		position: absolute;
		display: flex; align-items: center; justify-content: center;
		border-radius: 50%;
		background: rgba(0,0,0,0.45);
		border: 2px solid rgba(150,150,255,0.4);
		color: rgba(255,255,255,0.92);
		font-family: 'Arial Black', sans-serif;
		font-weight: 900;
		z-index: 10; pointer-events: auto;
		user-select: none; -webkit-user-select: none;
		touch-action: none;
	}
	.touch-btn.active { background: rgba(120,90,255,0.7); border-color: #a78bfa; transform: scale(0.92); }
	.touch-btn-a, .touch-btn-b, .touch-btn-x, .touch-btn-y { width: 62px; height: 62px; font-size: 20px; }
	.touch-btn-y { right: calc(max(20px, env(safe-area-inset-right)) + 96px); bottom: calc(max(20px, env(safe-area-inset-bottom)) + 152px); }
	.touch-btn-x { right: calc(max(20px, env(safe-area-inset-right)) + 160px); bottom: calc(max(20px, env(safe-area-inset-bottom)) + 88px); }
	.touch-btn-b { right: calc(max(20px, env(safe-area-inset-right)) + 32px);  bottom: calc(max(20px, env(safe-area-inset-bottom)) + 88px); }
	.touch-btn-a { right: calc(max(20px, env(safe-area-inset-right)) + 96px); bottom: calc(max(20px, env(safe-area-inset-bottom)) + 24px); }
	.touch-btn-lb, .touch-btn-rb { width: 76px; height: 46px; border-radius: 12px; font-size: 14px; }
	.touch-btn-lb { left: max(16px, env(safe-area-inset-left)); top: max(16px, env(safe-area-inset-top)); }
	.touch-btn-rb { right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); }
	.touch-btn-start {
		width: 50px; height: 50px; font-size: 15px; border-radius: 12px;
		left: 50%; top: max(16px, env(safe-area-inset-top)); transform: translateX(-50%);
	}
	.touch-btn-start.active { transform: translateX(-50%) scale(0.92); }

	@media (orientation: portrait) {
		#touch-stick { width: 128px; height: 128px; }
		#touch-stick-knob { width: 50px; height: 50px; }
		.touch-btn-a, .touch-btn-b, .touch-btn-x, .touch-btn-y { width: 56px; height: 56px; font-size: 17px; }
		.touch-btn-y { right: calc(max(16px, env(safe-area-inset-right)) + 84px); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 136px); }
		.touch-btn-x { right: calc(max(16px, env(safe-area-inset-right)) + 142px); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 78px); }
		.touch-btn-b { right: calc(max(16px, env(safe-area-inset-right)) + 26px);  bottom: calc(max(16px, env(safe-area-inset-bottom)) + 78px); }
		.touch-btn-a { right: calc(max(16px, env(safe-area-inset-right)) + 84px); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 20px); }
		.touch-btn-lb, .touch-btn-rb { width: 62px; height: 40px; font-size: 12px; }
	}
</style>
</head>
<body>

<canvas id="canvas" width="1280" height="720" tabindex="-1"></canvas>
<div id="hud"></div>

<!-- DEVICE SELECTOR + GRAPHICS -->
<div id="device-select">
  <div class="ds-title">KITO</div>
  <div class="ds-sub">Selecciona tu dispositivo</div>
  <div class="ds-cards">
    <button class="ds-card" data-device="pc" id="ds-pc" type="button">

<script type="module">

function bindGraphics() {

// Filtro de errores cosméticos
(function() {
  const ignore = [
    /Bink is not available/i, /LookupVar\(.+\) failed/i,
    /ASSET\.SetPath works best/i, /Unknown option 'wgpu'/i,
    /Settings file missing/i, /ped HD assets/i,
    /Attempting to release NULL/i, /Failed to load resource.*favicon/i,
    /NetworkAssertf/i, /NetworkVerifyf/i, /Profile Stats Flush/i,
    /grcResourceCache::/i, /grcDevice::/i, /writes colour output/i,
    /cloudflareinsights/i, /flip invoke buffers/i,
  ];
  const origE = console.error.bind(console);
  const origW = console.warn.bind(console);
  const skip = (args) => {
    const m = args.map(a => typeof a === 'string' ? a : (a?.message || String(a))).join(' ');
    return ignore.some(r => r.test(m));
  };
  console.error = (...a) => { if (!skip(a)) origE(...a); };
  console.warn  = (...a) => { if (!skip(a)) origW(...a); };
})();

// ============================================================
// AUDIO CONTEXT (gesto del usuario)
// ============================================================
let sharedAudioCtx = null;
function initAudioCtx() {
  if (sharedAudioCtx) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    sharedAudioCtx = new AC({ latencyHint: 'interactive' });
    sharedAudioCtx.resume().catch(() => {});
    const buf = sharedAudioCtx.createBuffer(1, 1, sharedAudioCtx.sampleRate);
    const src = sharedAudioCtx.createBufferSource();
    src.buffer = buf; src.connect(sharedAudioCtx.destination); src.start(0);
  } catch (e) {}
}

// ============================================================
// MÚSICA DE INTRO
// ============================================================
const AmbientAudio = (function() {
  let playing = false, masterGain = null, schedId = null, nextT = 0, step = 0;
  const CHORDS = [[57,60,64], [53,57,60], [48,52,55], [55,59,62]];
  const ARP = [57,60,64,69,72,69,64,60];
  const ROOT = [45, 41, 36, 43];
  const BPM = 88;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function init() {
    if (!sharedAudioCtx || masterGain) return;
    masterGain = sharedAudioCtx.createGain();
    masterGain.gain.value = 0;
    masterGain.connect(sharedAudioCtx.destination);
  }
  function note(freq, t, dur, gain) {
    const o = sharedAudioCtx.createOscillator();
    o.type = 'sawtooth'; o.frequency.value = freq;
    const g = sharedAudioCtx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    const f = sharedAudioCtx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 2000;
    o.connect(g); g.connect(f); f.connect(masterGain);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function scheduler() {
    if (!playing || !sharedAudioCtx) return;
    const stepDur = 60 / BPM / 4;
    while (nextT < sharedAudioCtx.currentTime + 0.15) {
      const bar = Math.floor(step / 16) % CHORDS.length;
      const beat = step % 16;
      if (beat === 0) for (const n of CHORDS[bar]) note(mtof(n + 12), nextT, 1.6, 0.06);
      if (beat % 2 === 1) note(mtof(ARP[step % ARP.length] + 12), nextT, 0.2, 0.08);
      if (beat % 4 === 0) note(mtof(ROOT[bar]), nextT, 0.35, 0.15);
      nextT += stepDur;
      step++;
    }
    schedId = setTimeout(scheduler, 25);
  }
  function start() {
    init();
    if (!sharedAudioCtx || playing) return;
    if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume().catch(() => {});
    playing = true; step = 0;
    nextT = sharedAudioCtx.currentTime + 0.1;
    masterGain.gain.setValueAtTime(0, sharedAudioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0.5, sharedAudioCtx.currentTime + 2);
    scheduler();
  }
  function stop() {
    if (!playing) return;
    playing = false;
    if (schedId) clearTimeout(schedId);
    if (masterGain && sharedAudioCtx) {
      masterGain.gain.cancelScheduledValues(sharedAudioCtx.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, sharedAudioCtx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0, sharedAudioCtx.currentTime + 1.2);
    }
  }
  return {
    start, stop,
    toggle: () => { if (playing) { stop(); return false; } else { start(); return true; } },
    isPlaying: () => playing,
  };
})();

const clickScreen = document.getElementById('click-to-start');

(function initSlidingScreens() {
  const holder = document.getElementById('ls-screens');
  if (!holder) return;
  const SCREENS = [
    { class: 'screen-1', label: 'LOS SANTOS', sub: 'CITY OF ANGELS' },
    { class: 'screen-2', label: 'VINEWOOD', sub: 'STARS & SUNSET' },
    { class: 'screen-3', label: 'SANDY SHORES', sub: 'DESERT HIGHWAY' },
    { class: 'screen-4', label: 'PALETO BAY', sub: 'FOREST & FOG' },
    { class: 'screen-5', label: 'DOWNTOWN', sub: 'NEON LIGHTS' },
    { class: 'screen-6', label: 'MT. CHILIAD', sub: 'FROZEN PEAK' },
    { class: 'screen-7', label: 'DEL PERRO', sub: 'PIER & OCEAN' },
    { class: 'screen-8', label: 'ROCKFORD HILLS', sub: 'WEALTH & POWER' },
  ];
  let currentEl = null, nextIndex = 0, alt = -1, stopped = false;
  function cubicInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(2 - 2 * t, 3) / 2; }
  function createScreen(def) {
    const el = document.createElement('div');
    el.className = 'ls-screen ' + def.class;
    el.innerHTML = '<div class="screen-bg"></div><div class="screen-label">' + def.label + '<small>' + def.sub + '</small></div>';
    return el;
  }
  function animateIn(el, fromX) {
    const dur = 900, start = performance.now(), toX = 0;
    el.style.transform = 'translateX(' + fromX + 'px)';
    function tick() {
      if (stopped) return;
      const t = Math.min(1, (performance.now() - start) / dur);
      const e = cubicInOut(t);
      el.style.transform = 'translateX(' + (fromX + (toX - fromX) * e) + 'px)';
      const lbl = el.querySelector('.screen-label');
      if (lbl) { lbl.style.transform = 'translateX(' + (40 * (1 - e)) + 'px)'; lbl.style.opacity = e; }
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  function animateOut(el, dir) {
    if (!el) return;
    const dur = 900, start = performance.now(), toX = dir * -1280;
    function tick() {
      const t = Math.min(1, (performance.now() - start) / dur);
      el.style.transform = 'translateX(' + (toX * cubicInOut(t)) + 'px)';
      if (t < 1) requestAnimationFrame(tick);
      else el.remove();
    }
    requestAnimationFrame(tick);
  }
  function next() {
    if (stopped) return;
    alt = alt <= 0 ? 1 : -1;
    const old = currentEl;
    const def = SCREENS[nextIndex];
    const el = createScreen(def);
    holder.appendChild(el);
    animateIn(el, alt * 1280);
    if (old) animateOut(old, alt);
    currentEl = el;
    nextIndex = (nextIndex + 1) % SCREENS.length;
    setTimeout(next, 8000);
  }
  setTimeout(next, 500);
  window.__stopSlidingScreens = () => { stopped = true; };
})();

{
  const stage = document.getElementById('ls-stage');
  const fit = () => {
    const s = Math.min(innerWidth / 1280, innerHeight / 720);
    stage.style.transform = 'translate(' + (innerWidth - 1280 * s) / 2 + 'px,' + (innerHeight - 720 * s) / 2 + 'px) scale(' + s + ')';
  };
  fit(); addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 200));
}

// ============================================================
// MODES
// ============================================================
let startMode = qs.get('mode') === 'story' ? 1 : qs.get('mode') === 'sandbox' ? 2 : 0;
let startModeWord = null, startCommitted = false, pickingMap = false, waitingChoice = false;
const ACTS = {
  back: ['Atrás'],
  map5: ['Mapa GTA V'],
  map6: ['Mapa GTA VI'],
  sandbox: ['Modo Sandbox'],
  story: ['Modo Historia'],
};
const LOADING = { 1: 'Cargando Historia', 2: 'Cargando Sandbox: GTA V', 3: 'Cargando Sandbox: GTA VI' };
const modesEl = document.getElementById('modes');
const modeButtons = [...modesEl.querySelectorAll('button')];
const isMode = (act) => act === 'story' || act === 'sandbox';

const showModes = () => {
  for (const b of modeButtons) {
    const act = b.dataset.act;
    const loading = !pickingMap && (act === 'story' ? startMode === 1 : act === 'sandbox' && startMode >= 2);
    b.textContent = loading ? LOADING[startMode] : ACTS[act][0];
    b.hidden = startCommitted ? !loading : pickingMap === isMode(act);
  }
  syncMobileModeOverlay();
};
const choose = (m) => {
  pickingMap = false;
  if (m !== startMode) { startMode = m; if (startModeWord) Atomics.store(startModeWord, 0, m); }
  showModes();
};
const act = (a) => {
  if (startCommitted) return;
  if (a === 'story') choose(1);
  else if (a === 'map5') choose(2);
  else if (a === 'map6') choose(3);
  else { pickingMap = a === 'sandbox'; showModes(); }
};
modesEl.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b && !b.hidden) act(b.dataset.act);
});

// Mobile overlay
const mobileModes = document.getElementById('mobile-modes');
const mmTitle = document.getElementById('mm-title');
const mmButtons = document.getElementById('mm-buttons');

function rebuildMobileModes() {
  mmButtons.innerHTML = '';
  if (pickingMap) {
    mmTitle.textContent = 'ELIGE MAPA';
    addMM('map5', '🗺️', 'Mapa GTA V', 'Los Santos + Blaine County');
    addMM('map6', '🌆', 'Mapa GTA VI', 'Vice City (experimental)');
    addMM('back', '←', 'Atrás', 'Volver a elegir modo');
  } else {

    addMM('story', '📖', 'Modo Historia', 'Campaña completa');
    addMM('sandbox', '🎮', 'Modo Sandbox', 'Elige mapa libremente');
  }
}
function addMM(a, icon, label, desc) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'mm-btn';
  b.innerHTML = icon + ' ' + label + '<span class="mm-desc">' + desc + '</span>';
  const h = (e) => { e.preventDefault(); e.stopPropagation(); act(a); };
  b.addEventListener('click', h);
  b.addEventListener('touchend', h, { passive: false });
  mmButtons.appendChild(b);
}
function syncMobileModeOverlay() {
  if (!touchMode) { mobileModes.classList.remove('visible'); return; }
  if (waitingChoice && !startCommitted && !startMode) {
    rebuildMobileModes();
    mobileModes.classList.add('visible');
  } else {
    mobileModes.classList.remove('visible');
  }
}
showModes();

// ============================================================
// PROGRESS + STALL WATCHDOG
// ============================================================
const hud = document.getElementById('hud');
const stallOverlay = document.getElementById('stall-overlay');
const soPhase = document.getElementById('so-phase');
const soMsg = document.getElementById('so-msg');

let lastEngineActivity = performance.now();
let lastKnownPct = 0;
let lastKnownLabel = '';

{
  const loading = document.getElementById('loading');
  const fill = document.getElementById('fill');
  const label = document.getElementById('label');
  const pct = document.getElementById('pct');
  let target = 0, shown = 0, ready = false, dirty = false;
  let dataBytes = 0;
  const samples = [];
  let lastLine = '';
  const consoleEl = document.getElementById('console');
  const bc = new BroadcastChannel('game-progress');

  bc.onmessage = (ev) => {
    const m = ev.data;
    lastEngineActivity = performance.now();

    if (m.dl) { dataBytes += m.dl; samples.push([performance.now(), m.dl]); return; }
    if (m.lines) { lastLine = m.lines[m.lines.length - 1]; dirty = true; return; }
    if (m.error) { label.textContent = m.error; label.style.color = '#e66'; return; }

    if (m.pct > target) {
      target = m.pct;
      lastKnownPct = m.pct;
      if (m.label && !waitingChoice) { label.textContent = m.label; lastKnownLabel = m.label; }
    }
    if (m.choice && !startMode) { waitingChoice = true; showModes(); lastEngineActivity = performance.now(); }
    if (m.commit) { startCommitted = true; pickingMap = false; if (m.mode) startMode = m.mode; showModes(); }
    if (m.world) {
      ready = true;
      if (window.__stopSlidingScreens) window.__stopSlidingScreens();
      AmbientAudio.stop();
      mobileModes.classList.remove('visible');
      stallOverlay.classList.remove('visible');
      target = 100;
    }
  };

  // Watchdog: si el motor no manda nada durante X segundos, mostrar overlay
  let stallShown = false;
  let waitExtended = false;
  setInterval(() => {
    if (ready || !gameStarted) return;
    if (waitingChoice) { lastEngineActivity = performance.now(); return; } // Esperando click del usuario = normal
    const quiet = (performance.now() - lastEngineActivity) / 1000;
    if (quiet > 40 && !stallShown && !waitExtended) {
      stallShown = true;
      soPhase.textContent = 'Fase: ' + (lastKnownLabel || 'desconocida') + ' · ' + Math.round(lastKnownPct) + '%';
      let msg = '';
      if (lastKnownPct >= 60 && lastKnownPct <= 68) {
        msg = 'El motor está en la fase de <b>inicialización del núcleo</b>. Esta fase incluye montar los RPF de audio y tarda 1-3 minutos en móviles. Sé paciente si tienes Exynos 1580 o similar.';
      } else if (lastKnownPct >= 70 && lastKnownPct <= 78) {
        msg = 'El motor está <b>montando dispositivos</b>. En esta fase inicializa audio y controles. Tarda 30-60s la primera vez. En cargas posteriores será instantáneo.';
      } else {
        msg = 'Lleva ' + Math.round(quiet) + 's sin enviar progreso. Puede ser la red, la compilación de shaders o que el dispositivo no tiene suficiente memoria.';
      }
      soMsg.innerHTML = msg;
      stallOverlay.classList.add('visible');
    }
  }, 5000);

  document.getElementById('so-wait').addEventListener('click', () => {
    stallOverlay.classList.remove('visible');
    waitExtended = true;
    lastEngineActivity = performance.now();
    setTimeout(() => { waitExtended = false; stallShown = false; }, 90000);
  });
  document.getElementById('so-retry').addEventListener('click', () => location.reload());
  document.getElementById('so-lower').addEventListener('click', () => {
    localStorage.setItem('kito_quality', 'low');
    localStorage.setItem('kito_scale', '0.5');
    localStorage.setItem('kito_fps', '30');
    location.reload();
  });

  const dataEl = document.getElementById('data');
  const timer = setInterval(() => {
    const now = performance.now();
    while (samples.length && now - samples[0][0] > 3000) samples.shift();
    const speed = samples.reduce((a, x) => a + x[1], 0) / 3;
    if (dataBytes) {
      dataEl.textContent = 'Game data: ' + (dataBytes / 1048576 | 0) + ' MB' + (speed > 1e4 ? ' (' + (speed / 1048576).toFixed(1) + ' MB/s)' : '');
    }
    const goal = ready ? 100 : Math.min(99, target + 6);
    shown += (goal - shown) * 0.06;
    if (dirty) { dirty = false; consoleEl.textContent = lastLine; }
    fill.style.width = shown.toFixed(1) + '%';
    pct.textContent = Math.round(shown) + '%';
    if (ready && shown > 99.5) { loading.classList.add('done'); clearInterval(timer); }
  }, 50);
}

// ============================================================
// WORKER
// ============================================================
let canvasEl = document.getElementById('canvas');

function fetchWithTimeout(url, opts = {}, timeoutMs = 30000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(timer));
}

window.addEventListener('game-start', async () => {
  if (!crossOriginIsolated) {
    document.getElementById('label').textContent = 'Sin aislamiento cross-origin. Abre por HTTPS.';
    document.getElementById('label').style.color = '#e66';
    setBoot(100, 'Error: sin aislamiento');
    setTimeout(hideBootScreen, 2000);
    return;
  }

  setBoot(60, 'Preparando canvas...');

  // ✅ Aplicar opciones gráficas del usuario
  const quality = GRAPHICS.quality;
  const scale = parseFloat(GRAPHICS.scale);
  const fpsCap = parseInt(GRAPHICS.fps, 10);

  const lowMemory = quality === 'low' || (quality === 'medium' && touchMode);
  const mediumQuality = quality === 'medium';
  const highQuality = quality === 'high';

  const ARGS = [];
  if (lowMemory) {
    ARGS.push(
      '-textureQuality=0', '-pedVariety=0', '-vehicleVariety=0',
      '-shadowQuality=-1', '-reflectionQuality=0', '-particleQuality=0',
      '-grassQuality=0', '-cityDensity=0', '-lodScale=0',
      '-pedLodBias=0', '-vehicleLodBias=0'
    );
  } else if (mediumQuality) {
    ARGS.push(
      '-textureQuality=1', '-pedVariety=1', '-vehicleVariety=1',
      '-shadowQuality=0', '-reflectionQuality=0', '-particleQuality=1',
      '-grassQuality=1', '-cityDensity=1', '-lodScale=1',
      '-pedLodBias=0', '-vehicleLodBias=0'
    );
  } else {
    ARGS.push(
      '-textureQuality=2', '-shadowQuality=1', '-reflectionQuality=1'
    );
  }

  const cores = touchMode ? 4 : Math.min(navigator.hardwareConcurrency * 2, 32);

  const wantSize = () => {
    const forced = /^(\d+)x(\d+)$/.exec(qs.get('res') || '');
    if (forced) return [+forced[1], +forced[2]];
    let w = innerWidth * (devicePixelRatio || 1) * scale;
    let h = innerHeight * (devicePixelRatio || 1) * scale;
    const cap = touchMode ? [1280, 720] : [2560, 1440];
    const k = Math.min(1, cap[0] / w, cap[1] / h);
    w *= k; h *= k;
    return [Math.max(480, Math.round(w / 2) * 2), Math.max(270, Math.round(h / 2) * 2)];
  };
  const startSize = wantSize();
  canvasEl.width = startSize[0];
  canvasEl.height = startSize[1];
  canvasEl.style.width = '100vw';
  canvasEl.style.height = '100vh';
  const offscreen = canvasEl.transferControlToOffscreen();

  setBoot(70, 'Descargando assets...');

  const PRIMARY = 'https://gta.deloskiyt.pl/b/8b0b5899ed';
  const CRITICAL = [
    { url: PRIMARY + '/shaders/index.json', label: 'Shaders' },
  ];
  const OPTIONAL = [
    { url: PRIMARY + '/shaders/pipelines.json', label: 'Pipelines' },
    { url: PRIMARY + '/shaders/pipelines_low.json', label: 'Pipelines low' },
  ];

  for (const item of OPTIONAL) {
    fetchWithTimeout(item.url, { cache: 'reload' }, 60000)
      .catch((e) => console.warn('[Preload opt] ' + item.label + ':', e.message || e));
  }

  let n = 0;
  await Promise.all(CRITICAL.map(async (item) => {
    try {
      const res = await fetchWithTimeout(item.url, { cache: 'reload' }, 60000);
      if (res.ok) await res.blob();
    } catch (e) {}
    n++;
    setBoot(70 + (n / CRITICAL.length) * 25, item.label + ' (' + n + '/' + CRITICAL.length + ')');
  }));

  setBoot(95, 'Iniciando motor...');

  const worker = new Worker(BASE_PATH + '/loader.js');
  worker.onmessage = (ev) => {
    if (ev.data.hud) hud.textContent = ev.data.hud;
    if (ev.data.input) {
      installInput(ev.data.input.memory, ev.data.input.block);
      if (touchMode) setupTouchControls();
    }
    if (ev.data.audio) { audioPending = ev.data.audio; tryStartAudio(); }
  };
  worker.onerror = (e) => { hud.textContent = 'Worker error: ' + e.message; };

  const frameLimit = fpsCap === 0 ? 0 : fpsCap === 30 ? 2 : 1;

  // ✅ Sin GPU: si no hay navigator.gpu, NO se pasa -wgpu (deja que el motor decida)
  const hasGPU = !!navigator.gpu;
  const gpuArg = hasGPU ? ['-wgpu'] : [];

  worker.postMessage({
    canvas: offscreen, base: BASE_PATH,
    args: ['-rootdir=/game/', ...gpuArg,
      '-nodisplaycalibration', '-noSocialClub', '-pc:nosocialclub',
      '-nonetwork', '-output',
      '-width=' + startSize[0], '-height=' + startSize[1], '-forceResolution',
      '-Script_all=warning', '-replay_all=warning', '-fastscriptcore',
      '-frameLimit=' + frameLimit,
      ...(cores <= 2 ? ['-numCores=' + cores] : []),
      ...ARGS,
      ...(qs.get('args') || '').split(',').filter(Boolean)],
    shotEvery: 0,
    cores, lowMemory,
    slots: touchMode ? 2 : 4,
    syncPipelines: false,
    remoteLog: false,
  }, [offscreen]);

  setTimeout(() => { setBoot(100, 'Iniciando...'); hideBootScreen(); }, 500);
});

const BASE_PATH = '';

function tryStartAudio() {
  if (!audioPending || audioStarted) return;
  audioStarted = true;
  (async () => {
    try {
      let ctx = sharedAudioCtx;
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
        sharedAudioCtx = ctx;
      }
      if (ctx.state !== 'running') { try { await ctx.resume(); } catch (e) {} }
      await Promise.race([
        ctx.audioWorklet.addModule(BASE_PATH + '/audio-worklet.js'),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000)),
      ]);
      const node = new AudioWorkletNode(ctx, 'game-audio', {
        numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2],
        processorOptions: audioPending,
      });
      node.connect(ctx.destination);
    } catch (e) {
      audioStarted = false;
    }
  })();
}
for (const t of ['pointerdown', 'touchstart', 'keydown']) {
  addEventListener(t, () => { audioGesture = true; tryStartAudio(); }, { capture: true, passive: true });
}

// ============================================================
// INPUT
// ============================================================
const VK = {
  Backspace:0x08,Tab:0x09,Enter:0x0D,NumpadEnter:0xFD,Escape:0x1B,Space:0x20,
  ArrowLeft:0x25,ArrowUp:0x26,ArrowRight:0x27,ArrowDown:0x28,
  ShiftLeft:0xA0,ShiftRight:0xA1,ControlLeft:0xA2,ControlRight:0xA3,
  AltLeft:0xA4,AltRight:0xA5,Equal:0xBB,
};
for (let i = 0; i < 10; i++) { VK['Digit' + i] = 0x30 + i; VK['Numpad' + i] = 0x60 + i; }
for (let i = 0; i < 26; i++) VK['Key' + String.fromCharCode(65 + i)] = 0x41 + i;
for (let i = 1; i <= 24; i++) VK['F' + i] = 0x6F + i;

let inputRef = null;

function installInput(memory, block) {
  const keys = new Uint8Array(memory.buffer, block, 256);
  const w = new Int32Array(memory.buffer, block + 256, 10);
  const U16 = new Uint16Array(memory.buffer, block + 256 + 40, 64);
  const MX=0,MY=1,DX=2,DY=3,DZ=4,BTN=5,FOCUS=6,LOCKED=7,HEAD=8,TAIL=9;
  const W = canvasEl.width || 1280, H = canvasEl.height || 720;
  const ext = new Int32Array(memory.buffer, block + 424, 4);
  startModeWord = new Int32Array(memory.buffer, block + 440, 1);
  if (startMode) Atomics.store(startModeWord, 0, startMode);
  Atomics.store(ext, 2, W); Atomics.store(ext, 3, H);
  Atomics.store(w, FOCUS, document.hasFocus() ? 1 : 0);
  Atomics.store(w, MX, W >> 1); Atomics.store(w, MY, H >> 1);

  inputRef = { keys, w, W, H, MX, MY, DX, DY, BTN, FOCUS, LOCKED };

  addEventListener('keydown', (e) => { const vk = VK[e.code]; if (vk) Atomics.store(keys, vk, 0x80); });
  addEventListener('keyup', (e) => { const vk = VK[e.code]; if (vk) Atomics.store(keys, vk, 0); });
  addEventListener('contextmenu', (e) => e.preventDefault());
  canvasEl.addEventListener('mousedown', (e) => {
    if (document.pointerLockElement !== canvasEl) canvasEl.requestPointerLock({ unadjustedMovement: true }).catch(() => canvasEl.requestPointerLock());
    Atomics.or(w, BTN, 1 << [0,2,1,3,4][e.button]);
  });
  addEventListener('mouseup', (e) => { Atomics.and(w, BTN, ~(1 << [0,2,1,3,4][e.button])); });
  addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === canvasEl) {
      Atomics.add(w, DX, e.movementX);
      Atomics.add(w, DY, e.movementY);
    }
  });
}

function setupTouchControls() {
  if (!inputRef) return;
  const ui = document.getElementById('touch-ui');
  if (ui.classList.contains('active')) return;
  ui.classList.add('active');

  const { keys, w, DX, DY, BTN } = inputRef;

  function setKey(code, down) {
    const vk = VK[code];
    if (vk === undefined) return;
    Atomics.store(keys, vk, down ? 0x80 : 0);
  }

  document.querySelectorAll('.touch-btn').forEach((btn) => {
    const keyCode = btn.dataset.key;
    const btnId = btn.dataset.btn;
    const press = (e) => {
      e.preventDefault(); e.stopPropagation();
      btn.classList.add('active');
      if (keyCode) setKey(keyCode, true);
      if (btnId !== undefined) Atomics.or(w, BTN, 1 << parseInt(btnId, 10));
    };
    const release = (e) => {
      e.preventDefault(); e.stopPropagation();
      btn.classList.remove('active');
      if (keyCode) setKey(keyCode, false);
      if (btnId !== undefined) Atomics.and(w, BTN, ~(1 << parseInt(btnId, 10)));
    };
    btn.addEventListener('touchstart', press, { passive: false });
    btn.addEventListener('touchend', release, { passive: false });
    btn.addEventListener('touchcancel', release, { passive: false });
  });

  const stick = document.getElementById('touch-stick');
  const knob = document.getElementById('touch-stick-knob');
  let stickId = null, cx = 0, cy = 0, r = 0;

  stick.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    stickId = t.identifier;
    const rect = stick.getBoundingClientRect();
    cx = rect.left + rect.width / 2;
    cy = rect.top + rect.height / 2;
    r = rect.width / 2 * 0.75;
  }, { passive: false });

  stick.addEventListener('touchmove', (e) => {
    if (stickId === null) return;
    for (const t of e.changedTouches) {
      if (t.identifier !== stickId) continue;
      e.preventDefault();
      let dx = t.clientX - cx, dy = t.clientY - cy;
      const d = Math.hypot(dx, dy);
      if (d > r) { dx = dx / d * r; dy = dy / d * r; }
      knob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
      const nx = dx / r, ny = dy / r;
      Atomics.store(keys, VK['KeyW'], ny < -0.3 ? 0x80 : 0);
      Atomics.store(keys, VK['KeyS'], ny >  0.3 ? 0x80 : 0);
      Atomics.store(keys, VK['KeyA'], nx < -0.3 ? 0x80 : 0);
      Atomics.store(keys, VK['KeyD'], nx >  0.3 ? 0x80 : 0);
    }
  }, { passive: false });

  const stickEnd = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier !== stickId) continue;
      e.preventDefault();
      stickId = null;
      knob.style.transform = 'translate(-50%, -50%)';
      Atomics.store(keys, VK['KeyW'], 0);
      Atomics.store(keys, VK['KeyS'], 0);
      Atomics.store(keys, VK['KeyA'], 0);
      Atomics.store(keys, VK['KeyD'], 0);
    }
  };
  stick.addEventListener('touchend', stickEnd, { passive: false });
  stick.addEventListener('touchcancel', stickEnd, { passive: false });

  const look = document.getElementById('touch-look');
  let lookId = null, lx = 0, ly = 0;
  look.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    lookId = t.identifier; lx = t.clientX; ly = t.clientY;
  }, { passive: true });
  look.addEventListener('touchmove', (e) => {
    if (lookId === null) return;
    for (const t of e.changedTouches) {
      if (t.identifier !== lookId) continue;
      const dx = t.clientX - lx, dy = t.clientY - ly;
      lx = t.clientX; ly = t.clientY;
      Atomics.add(w, DX, dx * 1.6);
      Atomics.add(w, DY, dy * 1.6);
    }
  }, { passive: true });
  look.addEventListener('touchend', () => { lookId = null; }, { passive: true });
  look.addEventListener('touchcancel', () => { lookId = null; }, { passive: true });
}
</script>
