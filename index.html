<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ApkProjects — Descarga juegos y apps</title>
<meta name="description" content="Catálogo de juegos y aplicaciones para descargar.">
<meta name="theme-color" content="#F2F2F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<style>
  :root{
    --bg:#F2F2F7;
    --surface:#FFFFFF;
    --surface-2:#FAFAFC;
    --separator:#E4E4E9;
    --label:#1C1C1E;
    --label-2:#6E6E73;
    --label-3:#AEAEB2;
    --blue:#007AFF;
    --blue-dark:#0060DF;
    --green:#34C759;
    --red:#FF3B30;
    --orange:#FF9500;
    --purple:#AF52DE;
    --yellow:#FFCC00;
    --pill:#E9E9EE;
    --radius-lg:20px;
    --radius-md:14px;
    --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-t:env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--label);
    font-family:var(--sys);
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(78px + var(--safe-b));
  }
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  button{font-family:var(--sys);}
  body.sheet-open{overflow:hidden;}

  /* ---------- Nav bar ---------- */
  .navbar{
    position:sticky; top:0; z-index:50;
    padding-top:var(--safe-t);
    background:rgba(242,242,247,.82);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--separator);
  }
  .navbar-inner{
    max-width:900px; margin:0 auto;
    padding:6px 16px 10px;
  }
  .navbar-title-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:4px 0 6px;
  }
  .navbar-title{
    font-size:15px; font-weight:600; color:var(--label);
    letter-spacing:-.01em;
  }
  .large-title{
    font-size:32px; font-weight:800; letter-spacing:-0.02em;
    margin:2px 0 10px; color:var(--label);
  }
  .search-wrap{
    display:flex; align-items:center; gap:8px;
  }
  .search-field{
    flex:1;
    display:flex; align-items:center; gap:6px;
    background:rgba(118,118,128,.12);
    border-radius:11px;
    padding:8px 10px;
  }
  .search-field svg{ color:var(--label-3); flex-shrink:0; }
  .search-field input{
    border:none; background:transparent; outline:none;
    font-family:var(--sys); font-size:16px; color:var(--label); width:100%;
  }
  .search-field input::placeholder{ color:var(--label-3); }
  .search-clear{
    display:none; width:18px; height:18px; border-radius:50%;
    background:var(--label-3); color:#fff; border:none; cursor:pointer;
    align-items:center; justify-content:center; flex-shrink:0;
  }
  .search-field.has-text .search-clear{ display:flex; }
  .cancel-btn{
    color:var(--blue); font-size:16px; font-weight:400; background:none;
    border:none; cursor:pointer; white-space:nowrap; padding:6px 2px;
    display:none;
  }
  .cancel-btn.show{ display:block; }

  /* ---------- Segmented category control ---------- */
  .segwrap{
    max-width:900px; margin:0 auto;
    padding:0 16px 12px;
    overflow-x:auto; scrollbar-width:none;
  }
  .segwrap::-webkit-scrollbar{display:none;}
  .segmented{
    display:inline-flex; gap:2px;
    background:var(--pill);
    padding:2px; border-radius:9px;
  }
  .seg-btn{
    flex-shrink:0;
    border:none; background:transparent; cursor:pointer;
    font-family:var(--sys); font-size:13px; font-weight:600; color:var(--label);
    padding:6px 14px; border-radius:7px;
    transition:background .15s, color .15s;
    white-space:nowrap;
  }
  .seg-btn.active{
    background:var(--surface); color:var(--label);
    box-shadow:0 1px 3px rgba(0,0,0,.12);
  }

  /* ---------- Ad card ---------- */
  .ad-slot{
    max-width:900px; margin:16px auto 0; padding:0 16px;
  }
  .ad-card{
    border-radius:var(--radius-md);
    background:var(--surface);
    border:.5px solid var(--separator);
    padding:10px 10px 12px;
    overflow:hidden;
  }
  .ad-card-label{
    font-size:10px; font-weight:700; color:var(--label-3);
    text-transform:uppercase; letter-spacing:.08em;
    text-align:center; margin-bottom:8px;
  }
  .ad-container{
    min-height:50px; display:flex; align-items:center; justify-content:center;
    overflow:hidden; border-radius:10px; background:var(--surface-2);
  }
  .ad-mobile{ display:flex; }
  .ad-desktop{ display:none; }
  #adSlotMiddle{ min-height:250px; }
  @media (min-width:640px){
    .ad-mobile{ display:none; }
    .ad-desktop{ display:flex; min-height:90px; }
  }

  /* ---------- Featured card ---------- */
  .featured-wrap{
    max-width:900px; margin:18px auto 0; padding:0 16px;
  }
  .featured-label{
    font-size:22px; font-weight:800; letter-spacing:-.01em; margin:0 0 10px;
  }
  .featured-card{
    position:relative; overflow:hidden;
    border-radius:var(--radius-lg);
    padding:22px 20px;
    min-height:170px;
    display:flex; flex-direction:column; justify-content:flex-end;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.18), transparent 45%),
      linear-gradient(135deg, var(--blue), #5856D6 60%, var(--purple));
    color:#fff;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .featured-eyebrow{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    opacity:.85; margin-bottom:6px;
  }
  .featured-name{ font-size:22px; font-weight:800; letter-spacing:-.01em; margin:0 0 4px; }
  .featured-sub{ font-size:13px; opacity:.9; max-width:70%; }
  .featured-icon{
    position:absolute; right:18px; top:18px;
    width:56px; height:56px; border-radius:22%;
    background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.3);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:20px; overflow:hidden;
  }
  .featured-icon img{ width:100%; height:100%; object-fit:cover; }

  /* ---------- Section ---------- */
  .section{
    max-width:900px; margin:0 auto; padding:26px 16px 4px;
  }
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px;
  }
  .section-head h2{
    font-size:22px; font-weight:800; margin:0; letter-spacing:-.01em;
  }
  .result-count{
    font-size:13px; color:var(--label-2); margin:-6px 0 12px;
  }

  /* ---------- Home-screen style icon grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(76px,1fr));
    gap:18px 8px;
  }
  .app-tile{
    background:transparent; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:2px; text-align:center;
    animation:tileIn .3s ease both;
  }
  @keyframes tileIn{
    from{ opacity:0; transform:scale(.9); }
    to{ opacity:1; transform:scale(1); }
  }
  .app-tile:active .app-icon{ transform:scale(.9); }
  .app-icon{
    width:100%; aspect-ratio:1/1;
    border-radius:22%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:22px; color:#fff;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.08), 0 4px 10px -4px rgba(0,0,0,.18);
    transition:transform .12s ease;
  }
  .app-icon img{ width:100%; height:100%; object-fit:cover; }
  .app-tile .name{
    font-size:11.5px; font-weight:500; color:var(--label);
    max-width:100%; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; line-height:1.3;
  }

  /* ---------- Empty state ---------- */
  .empty{
    grid-column:1/-1;
    border:1.5px dashed var(--separator);
    border-radius:var(--radius-md);
    background:var(--surface);
    padding:40px 20px;
    text-align:center;
    color:var(--label-2);
  }
  .empty .empty-mark{
    width:52px; height:52px; margin:0 auto 14px;
    border-radius:22%;
    background:var(--pill); color:var(--blue);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800;
  }
  .empty h3{ color:var(--label); font-size:15px; margin:0 0 4px; font-weight:700; }
  .empty p{ margin:0; font-size:13px; max-width:340px; margin:0 auto; }
  .empty code{ background:var(--bg); border:1px solid var(--separator); padding:1px 6px; border-radius:5px; font-size:12px; }

  /* ---------- Bottom tab bar ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:rgba(249,249,251,.86);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid var(--separator);
    padding-bottom:var(--safe-b);
  }
  .tabbar-inner{
    max-width:900px; margin:0 auto;
    display:flex;
  }
  .tab-btn{
    flex:1; background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 4px 6px;
    color:var(--label-3);
    font-family:var(--sys); font-size:10px; font-weight:600;
  }
  .tab-btn.active{ color:var(--blue); }
  .tab-btn svg{ width:24px; height:24px; }

  /* ---------- Sheet (bottom modal) ---------- */
  .overlay{
    position:fixed; inset:0; z-index:200;
    background:rgba(0,0,0,.35);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    background:var(--bg);
    width:100%; max-width:520px;
    border-radius:20px 20px 0 0;
    max-height:88vh; overflow-y:auto;
    transform:translateY(30px);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
    padding-bottom:calc(24px + var(--safe-b));
  }
  .overlay.show .sheet{ transform:translateY(0); }
  @media (min-width:640px){
    .overlay{ align-items:center; }
    .sheet{ border-radius:20px; max-height:80vh; }
  }
  .sheet-handle{
    width:36px; height:5px; border-radius:3px;
    background:var(--separator); margin:10px auto 4px;
  }
  .sheet-close{
    position:absolute; right:14px; top:14px;
    width:30px; height:30px; border-radius:50%;
    background:rgba(118,118,128,.16); border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:var(--label-2);
  }
  .sheet-inner{ position:relative; padding:6px 20px 4px; }
  .sheet-top{
    display:flex; gap:14px; align-items:center; margin:14px 0 18px;
  }
  .sheet-icon{
    width:78px; height:78px; border-radius:22%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:26px; color:#fff;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .sheet-icon img{ width:100%; height:100%; object-fit:cover; }
  .sheet-title h3{ font-size:19px; font-weight:800; margin:0 0 4px; letter-spacing:-.01em; }
  .sheet-meta{ font-size:12.5px; color:var(--label-2); display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .sheet-meta .stars{ color:var(--orange); }
  .sheet-tag{
    font-size:11px; font-weight:700; color:var(--blue);
    background:rgba(0,122,255,.1); padding:2px 9px; border-radius:6px;
    display:inline-block; margin-top:6px;
  }
  .sheet-desc{
    font-size:14px; color:var(--label); line-height:1.5; margin:0 0 22px;
  }
  .dl-label{
    font-size:12px; font-weight:700; color:var(--label-2);
    text-transform:uppercase; letter-spacing:.05em; margin:0 0 10px;
  }
  .dl-list{ display:flex; flex-direction:column; gap:10px; }
  .dl-option{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border-radius:14px;
    padding:13px 14px;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
  }
  .dl-option-left{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:14.5px; }
  .dl-option-left .dot{ width:8px; height:8px; border-radius:50%; background:var(--green); flex-shrink:0; }
  .dl-option-note{ font-size:11.5px; color:var(--label-2); font-weight:500; }
  .dl-go{
    background:var(--blue); color:#fff; border:none; border-radius:999px;
    padding:8px 18px; font-family:var(--sys); font-weight:700; font-size:13px;
    cursor:pointer; flex-shrink:0;
  }
  .dl-go:active{ background:var(--blue-dark); }

  /* ---------- Suggestion sheet form ---------- */
  .sg-field{ margin-bottom:14px; }
  .sg-field label{
    display:block; font-size:12px; font-weight:700; color:var(--label-2);
    text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;
  }
  .sg-field input, .sg-field textarea{
    width:100%; border:none; border-radius:12px;
    padding:12px 13px; font-family:var(--sys); font-size:16px; color:var(--label);
    background:var(--surface); outline:none; resize:vertical;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
  }
  .sg-field input:focus, .sg-field textarea:focus{ outline:2px solid var(--blue); }
  .sg-submit{
    width:100%; background:var(--blue); color:#fff; border:none;
    border-radius:14px; padding:14px 16px; font-family:var(--sys); font-weight:700;
    font-size:16px; cursor:pointer;
  }
  .sg-submit:active{ background:var(--blue-dark); }
  .sg-note{ font-size:12px; color:var(--label-2); margin:10px 0 0; text-align:center; }

  @media (max-width:420px){
    .large-title{ font-size:28px; }
    .grid{ grid-template-columns:repeat(auto-fill, minmax(68px,1fr)); gap:16px 6px; }
    .featured-name{ font-size:19px; }
  }
</style>
</head>
<body>

  <div class="navbar">
    <div class="navbar-inner">
      <div class="navbar-title-row">
        <span class="navbar-title">ApkProjects</span>
      </div>
      <h1 class="large-title">Catálogo</h1>
      <div class="search-wrap">
        <div class="search-field" id="searchField">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" placeholder="Buscar" id="searchInput" aria-label="Buscar juegos y apps">
          <button class="search-clear" id="searchClear" aria-label="Borrar" type="button">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <button class="cancel-btn" id="cancelBtn" type="button">Cancelar</button>
      </div>
    </div>
    <div class="segwrap">
      <div class="segmented" id="categoryBar">
        <button class="seg-btn active" data-cat="all" type="button">Todos</button>
        <button class="seg-btn" data-cat="accion" type="button">Acción</button>
        <button class="seg-btn" data-cat="aventura" type="button">Aventura</button>
        <button class="seg-btn" data-cat="arcade" type="button">Arcade</button>
        <button class="seg-btn" data-cat="deportes" type="button">Deportes</button>
        <button class="seg-btn" data-cat="apps" type="button">Apps</button>
      </div>
    </div>
  </div>

  <!-- AD SLOT: banner superior (Adsterra) -->
  <div class="ad-slot">
    <div class="ad-card">
      <div class="ad-card-label">Publicidad</div>
      <div class="ad-container ad-mobile" id="adSlotTopMobile"></div>
      <div class="ad-container ad-desktop" id="adSlotTopDesktop"></div>
    </div>
  </div>

  <div class="featured-wrap" id="featuredWrap"></div>

  <div class="section">
    <div class="section-head">
      <h2>Todo el catálogo</h2>
    </div>
    <p class="result-count" id="resultCount"></p>
    <div class="grid" id="gameGrid">
      <!-- ==========================================================
           CÓMO AGREGAR UN JUEGO
           Edita el array "games" al final del archivo (dentro del
           <script>) y agrega un objeto con este formato:

           {
             title: "Nombre del juego",
             category: "accion",        // accion, aventura, arcade, deportes o apps
             rating: 4.5,
             size: "85 MB",
             color: "#2563EB",          // color del ícono si NO hay portada
             initials: "NJ",            // iniciales si NO hay portada
             cover: "img/tuimagen.png", // ruta o URL de la portada
             description: "Breve descripción.",
             downloads: [
               { label: "Mediafire", note: "Servidor directo", url: "https://www.mediafire.com/..." }
             ]
           }

           Se ordenan solos alfabéticamente, no importa el orden aquí.
         =========================================================== -->
    </div>
  </div>

  <!-- AD SLOT: entre secciones (Adsterra) -->
  <div class="ad-slot" style="margin-top:26px;">
    <div class="ad-card">
      <div class="ad-card-label">Publicidad</div>
      <div class="ad-container" id="adSlotMiddle">
        <!-- Pega aquí tu script de Adsterra 300x250 -->
      </div>
    </div>
  </div>

  <!-- Bottom tab bar -->
  <div class="tabbar">
    <div class="tabbar-inner">
      <button class="tab-btn active" id="tabHome" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        Inicio
      </button>
      <button class="tab-btn" id="tabSearch" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        Buscar
      </button>
      <button class="tab-btn" id="tabTop" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>
        Arriba
      </button>
      <button class="tab-btn" id="tabSuggest" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        Sugerir
      </button>
    </div>
  </div>

  <!-- Detail sheet -->
  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-inner">
        <button class="sheet-close" id="sheetClose" aria-label="Cerrar" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <div class="sheet-top">
          <div class="sheet-icon" id="sheetIcon"></div>
          <div class="sheet-title">
            <h3 id="sheetTitle"></h3>
            <div class="sheet-meta" id="sheetMeta"></div>
            <span class="sheet-tag" id="sheetTag"></span>
          </div>
        </div>
        <p class="sheet-desc" id="sheetDesc"></p>
        <p class="dl-label">Métodos de descarga</p>
        <div class="dl-list" id="sheetDownloads"></div>
      </div>
    </div>
  </div>

  <!-- Suggestion sheet -->
  <div class="overlay" id="suggestOverlay">
    <div class="sheet" id="suggestSheet" role="dialog" aria-modal="true" aria-labelledby="suggestTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-inner">
        <button class="sheet-close" id="suggestClose" aria-label="Cerrar" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <div class="sheet-top">
          <div class="sheet-icon" style="background:linear-gradient(135deg,var(--purple),var(--blue))">💡</div>
          <div class="sheet-title">
            <h3 id="suggestTitle">Sugerir un juego o app</h3>
            <div class="sheet-meta">¿Falta algo en el catálogo? Cuéntanos.</div>
          </div>
        </div>
        <form id="suggestForm">
          <div class="sg-field">
            <label for="sgName">Nombre del juego o app</label>
            <input type="text" id="sgName" placeholder="Ej: Subway Surfers" required>
          </div>
          <div class="sg-field">
            <label for="sgDetails">Detalles (opcional)</label>
            <textarea id="sgDetails" rows="3" placeholder="Versión, enlace de referencia, plataforma, etc."></textarea>
          </div>
          <div class="sg-field">
            <label for="sgContact">Tu correo (opcional)</label>
            <input type="email" id="sgContact" placeholder="para avisarte cuando esté disponible">
          </div>
          <button type="submit" class="sg-submit">Enviar sugerencia</button>
          <p class="sg-note">Se abrirá tu app de correo con la sugerencia lista para enviar.</p>
        </form>
      </div>
    </div>
  </div>

<script>
  // ======================================================
  // AGREGA TUS JUEGOS AQUÍ. Se ordenan solos alfabéticamente.
  // ======================================================
  const games = [
    {
      title: "Minecraft 26.40",
      category: "aventura",
      rating: 4.8,
      size: "683 MB",
      color: "#65EB2A",
      initials: "",
      cover: "img/Minecraft.png",
      description: "Minecraft es un videojuego de mundo abierto y tipo sandbox (caja de arena) donde los jugadores pueden explorar, extraer recursos, construir y sobrevivir en un entorno tridimensional formado por bloques con texturas pixeladas.",
      downloads: [
        { label: "Mediafire", note: "Servidor directo", url: "https://www.mediafire.com/file/jzp4i369rlh1rvc/minecraft-26-40-30-apkprojetcs.apk/file" },
        { label: "Mega (No disponible)", note: "Alternativa", url: "https://mega.nz/" }
      ]
    },
    {
      title: "Geometry Dash",
      category: "arcade",
      rating: 4.8,
      size: "175 MB",
      color: "#65EB2A",
      initials: "",
      cover: "img/Geometry.png",
      description: "Juego de plataformas y acción rítmica.",
      downloads: [
        { label: "Mediafire", note: "Servidor directo", url: "https://www.mediafire.com/file/rlr008reqjawyi6/Geometry+dash+2.2-apkprojects.xyz.apk/file" }
      ]
    },
  ];

  const grid = document.getElementById('gameGrid');
  const categoryBar = document.getElementById('categoryBar');
  const searchInput = document.getElementById('searchInput');
  const searchField = document.getElementById('searchField');
  const searchClear = document.getElementById('searchClear');
  const cancelBtn = document.getElementById('cancelBtn');
  const resultCount = document.getElementById('resultCount');
  const featuredWrap = document.getElementById('featuredWrap');
  let activeCat = 'all';

  function starString(rating){
    const full = Math.round(rating);
    return '★'.repeat(full) + '☆'.repeat(5-full);
  }

  function iconMarkup(g){
    return g.cover ? `<img src="${g.cover}" alt="${g.title}" loading="lazy">` : (g.initials || g.title.slice(0,2).toUpperCase());
  }

  function renderFeatured(){
    if(!games.length){ featuredWrap.innerHTML = ''; return; }
    const top = games.slice().sort((a,b) => b.rating - a.rating)[0];
    featuredWrap.innerHTML = `
      <div class="featured-label">Destacado</div>
      <div class="featured-card" id="featuredCard" data-title="${top.title.replace(/"/g,'&quot;')}">
        <div class="featured-icon" ${top.cover ? '' : `style="background:${top.color}"`}>${iconMarkup(top)}</div>
        <div class="featured-eyebrow">Mejor calificado</div>
        <div class="featured-name">${top.title}</div>
        <div class="featured-sub">${(top.description||'').slice(0,80)}${(top.description||'').length>80?'…':''}</div>
      </div>`;
    document.getElementById('featuredCard').addEventListener('click', () => openSheet(top));
  }

  function render(){
    const term = searchInput.value.trim().toLowerCase();
    let filtered = games
      .filter(g => (activeCat === 'all' || g.category === activeCat) && g.title.toLowerCase().includes(term))
      .slice()
      .sort((a,b) => a.title.localeCompare(b.title, 'es', {sensitivity:'base'}));

    resultCount.textContent = games.length
      ? `${filtered.length} resultado${filtered.length===1?'':'s'}${term ? ` para "${term}"` : ''}`
      : '';

    if(filtered.length === 0){
      grid.innerHTML = `
        <div class="empty">
          <div class="empty-mark">AP</div>
          <h3>${games.length ? 'No encontramos nada con esa búsqueda' : 'Todavía no hay juegos aquí'}</h3>
          <p>${games.length ? 'Prueba con otra palabra, quita filtros, o usa "Sugerir" para pedirlo.' : 'Agrega tu primer juego editando el array <code>games</code> al final del archivo HTML.'}</p>
        </div>`;
      return;
    }

    grid.innerHTML = filtered.map((g, i) => `
      <button class="app-tile" style="animation-delay:${Math.min(i,14)*20}ms" data-title="${g.title.replace(/"/g,'&quot;')}" type="button">
        <div class="app-icon" ${g.cover ? '' : `style="background:${g.color}"`}>${iconMarkup(g)}</div>
        <span class="name">${g.title}</span>
      </button>
    `).join('');
  }

  // ---------- Detail sheet ----------
  const overlay = document.getElementById('overlay');
  const sheetIcon = document.getElementById('sheetIcon');
  const sheetTitle = document.getElementById('sheetTitle');
  const sheetMeta = document.getElementById('sheetMeta');
  const sheetTag = document.getElementById('sheetTag');
  const sheetDesc = document.getElementById('sheetDesc');
  const sheetDownloads = document.getElementById('sheetDownloads');

  function openSheet(game){
    sheetIcon.innerHTML = iconMarkup(game);
    sheetIcon.style.background = game.cover ? 'transparent' : game.color;
    sheetTitle.textContent = game.title;
    sheetMeta.innerHTML = `<span class="stars">${starString(game.rating||0)}</span> ${ (game.rating||0).toFixed(1) } · ${game.size||''}`;
    sheetTag.textContent = game.category;
    sheetDesc.textContent = game.description || 'Sin descripción todavía.';

    const options = (game.downloads && game.downloads.length)
      ? game.downloads
      : (game.link ? [{label:'Descargar', note:'Enlace directo', url:game.link}] : []);

    sheetDownloads.innerHTML = options.length
      ? options.map(d => `
        <div class="dl-option">
          <div class="dl-option-left"><span class="dot"></span>${d.label}${d.note ? `<span class="dl-option-note">&nbsp;· ${d.note}</span>` : ''}</div>
          <a class="dl-go" href="${d.url}" target="_blank" rel="noopener">Ir</a>
        </div>`).join('')
      : `<p class="dl-option-note">Todavía no hay enlaces de descarga para este juego.</p>`;

    overlay.classList.add('show');
    document.body.classList.add('sheet-open');
  }
  function closeSheet(){
    overlay.classList.remove('show');
    document.body.classList.remove('sheet-open');
  }

  grid.addEventListener('click', (e) => {
    const tile = e.target.closest('.app-tile');
    if(!tile) return;
    const game = games.find(g => g.title === tile.dataset.title);
    if(game) openSheet(game);
  });
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeSheet(); });

  // ---------- Suggestion sheet ----------
  const suggestOverlay = document.getElementById('suggestOverlay');
  const suggestForm = document.getElementById('suggestForm');
  const SUGGEST_EMAIL = 'contacto@apkprojects.xyz'; // <-- cambia esto por tu correo real

  function openSuggest(){
    suggestOverlay.classList.add('show');
    document.body.classList.add('sheet-open');
  }
  function closeSuggest(){
    suggestOverlay.classList.remove('show');
    document.body.classList.remove('sheet-open');
  }
  document.getElementById('tabSuggest').addEventListener('click', openSuggest);
  document.getElementById('suggestClose').addEventListener('click', closeSuggest);
  suggestOverlay.addEventListener('click', (e) => { if(e.target === suggestOverlay) closeSuggest(); });

  suggestForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('sgName').value.trim();
    const details = document.getElementById('sgDetails').value.trim();
    const contact = document.getElementById('sgContact').value.trim();
    const subject = `Sugerencia de juego/app: ${name}`;
    const body = `Juego/app sugerido: ${name}\n\nDetalles: ${details || '(sin detalles)'}\n\nCorreo de contacto: ${contact || '(no proporcionado)'}`;
    window.location.href = `mailto:${SUGGEST_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    suggestForm.reset();
    closeSuggest();
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){ closeSheet(); closeSuggest(); }
  });

  // ---------- Segmented category control ----------
  categoryBar.addEventListener('click', (e) => {
    const btn = e.target.closest('.seg-btn');
    if(!btn) return;
    categoryBar.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    render();
  });

  // ---------- iOS-style search (focus -> Cancel appears) ----------
  searchInput.addEventListener('input', () => {
    searchField.classList.toggle('has-text', searchInput.value.length > 0);
    render();
  });
  searchInput.addEventListener('focus', () => cancelBtn.classList.add('show'));
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchField.classList.remove('has-text');
    render();
    searchInput.focus();
  });
  cancelBtn.addEventListener('click', () => {
    searchInput.value = '';
    searchField.classList.remove('has-text');
    cancelBtn.classList.remove('show');
    searchInput.blur();
    render();
  });

  // ---------- Bottom tab bar ----------
  const tabs = [document.getElementById('tabHome'), document.getElementById('tabSearch'), document.getElementById('tabTop')];
  function setActiveTab(el){ tabs.forEach(t => t.classList.remove('active')); if(el) el.classList.add('active'); }

  document.getElementById('tabHome').addEventListener('click', () => {
    window.scrollTo({top:0, behavior:'smooth'});
    setActiveTab(document.getElementById('tabHome'));
  });
  document.getElementById('tabSearch').addEventListener('click', () => {
    window.scrollTo({top:0, behavior:'smooth'});
    setTimeout(() => searchInput.focus(), 300);
    setActiveTab(document.getElementById('tabSearch'));
  });
  document.getElementById('tabTop').addEventListener('click', () => {
    window.scrollTo({top:0, behavior:'smooth'});
  });

  window.addEventListener('scroll', () => {
    if(window.scrollY < 40) setActiveTab(document.getElementById('tabHome'));
  });

  // ======================================================
  // ANUNCIOS ADSTERRA — carga aislada en iframe (sin cambios
  // respecto a como los tenías, solo movidos al nuevo diseño).
  // ======================================================
  function loadAdsterraAd(containerId, key, width, height){
    const container = document.getElementById(containerId);
    if(!container || !key) return;
    const iframe = document.createElement('iframe');
    iframe.title = 'Publicidad';
    iframe.style.border = '0';
    iframe.style.width = width + 'px';
    iframe.style.height = height + 'px';
    iframe.style.maxWidth = '100%';
    iframe.scrolling = 'no';
    container.appendChild(iframe);
    const doc = iframe.contentWindow.document;
    doc.open();
    doc.write(
      '<!DOCTYPE html><html><head><style>html,body{margin:0;padding:0;overflow:hidden;background:transparent;}</style></head><body>' +
      '<script>atOptions={"key":"' + key + '","format":"iframe","height":' + height + ',"width":' + width + ',"params":{}};<\/script>' +
      '<script src="https://www.highperformanceformat.com/' + key + '/invoke.js"><\/script>' +
      '</body></html>'
    );
    doc.close();
  }

  loadAdsterraAd('adSlotTopMobile', '0c552db9603823b8354d2c686ebe16d7', 320, 50);
  loadAdsterraAd('adSlotTopDesktop', '76a4887bf5246065c1644d5ff3ee96ae', 728, 90);
  loadAdsterraAd('adSlotMiddle', 'f49c2e7ae12570d06b9c194497928af0', 300, 250);

  renderFeatured();
  render();
</script>
