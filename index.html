<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library</title>
<style>
  /* ===== ESTILOS (Los mismos que ya tienes) ===== */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    background:#0e1014;color:#c7d5e0;
    font:14px/1.4 "Motiva Sans","Segoe UI",Arial,sans-serif;
    min-height:100vh;overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ad-slot{display:flex;align-items:center;justify-content:center;width:100%}
  .ad-slot iframe{border:0;display:block}
  #ad-top{padding:14px 0;background:#171a21;border-bottom:1px solid #23232c}
  #ad-bottom{padding:12px 0;background:#171a21;border-top:1px solid #23232c;margin-top:30px}
  .topbar{background:#171a21;border-bottom:1px solid #000;padding:10px 24px;display:flex;align-items:center;gap:22px;position:sticky;top:0;z-index:50;animation:fadeIn .4s ease-out}
  .logo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#fff;letter-spacing:.3px;flex-shrink:0}
  .logo svg{width:20px;height:20px;fill:#fff}
  .tabs{display:flex;gap:4px;flex:1;margin-left:6px}
  .tabs button{padding:8px 14px;border-radius:3px;color:#b8b6b4;font-size:13px;background:none;border:0;cursor:pointer;font:inherit;transition:color .2s,background .2s,transform .15s;white-space:nowrap}
  .tabs button:hover{color:#fff;background:#1e2530}
  .tabs button:active{transform:scale(.96)}
  .tabs button.active{color:#fff;background:#1e2530;box-shadow:inset 0 -2px 0 #66c0f4}
  .search{position:relative;flex-shrink:0}
  .search input{background:#316282;border:1px solid #000;border-radius:3px;padding:7px 32px 7px 12px;color:#fff;font-size:13px;outline:none;width:220px;transition:background .2s,width .25s cubic-bezier(.2,0,.2,1)}
  .search input:focus{background:#3d789f;width:280px}
  .search input::placeholder{color:#a7c4db}
  .search svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;fill:#a7c4db;pointer-events:none;transition:fill .2s}
  .search input:focus + svg{fill:#fff}
  main{padding:28px 32px 60px;max-width:1600px;margin:0 auto}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;animation:fadeUp .5s ease-out .05s both}
  .section-head h2{font-size:20px;font-weight:600;color:#fff;letter-spacing:.2px}
  .section-head .count{font-size:12px;color:#67707a}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  .card{position:relative;display:block;border-radius:3px;overflow:hidden;background:#1b2838;aspect-ratio:3/4;cursor:pointer;transition:transform .28s cubic-bezier(.2,0,.2,1),box-shadow .28s cubic-bezier(.2,0,.2,1);animation:fadeUp .55s cubic-bezier(.2,0,.2,1) both}
  .card:nth-child(1){animation-delay:.1s}
  .card:nth-child(2){animation-delay:.2s}
  .card::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,transparent 40%,rgba(0,0,0,.35));opacity:0;transition:opacity .3s;pointer-events:none}
  .card:hover::after{opacity:1}
  .card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 0 0 2px #66c0f4,0 12px 32px rgba(0,0,0,.55),0 0 40px rgba(102,192,244,.25);z-index:2}
  .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,0,.2,1)}
  .card:hover img{transform:scale(1.06)}
  .card .overlay{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,0) 100%);pointer-events:none;transition:padding .3s}
  .card:hover .overlay{padding-bottom:14px}
  .card .name{color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .3s}
  .card:hover .name{transform:translateY(-2px)}
  .card .badge{position:absolute;top:8px;left:8px;background:rgba(102,192,244,.9);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:2px;letter-spacing:.5px;opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .3s;pointer-events:none}
  .card:hover .badge{opacity:1;transform:translateY(0)}
  .card.empty{background:#141a22;border:1px dashed #1f2a36;display:flex;align-items:center;justify-content:center;cursor:default;animation:none}
  .card.empty::before{content:'+';font-size:32px;color:#2a3849;font-weight:300;transition:color .2s,transform .2s}
  .card.empty:hover{transform:none;box-shadow:none;border-color:#2a3849}
  .card.empty:hover::before{color:#3a4a59;transform:scale(1.1)}
  .card.empty::after{display:none}
  #loader{position:fixed;inset:0;background:rgba(11,14,19,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;animation:fadeIn .3s ease-out}
  #loader.on{display:flex}
  #loader .spin{width:36px;height:36px;border:3px solid #1b2838;border-top-color:#66c0f4;border-radius:50%;animation:spin .8s linear infinite}
  #loader .txt{color:#8ba6bf;font-size:13px;letter-spacing:.5px}
  @media (max-width:800px){
    .topbar{padding:10px 14px;gap:10px}
    .tabs{display:none}
    .search input{width:150px}
    .search input:focus{width:180px}
    main{padding:16px 14px 40px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    #ad-top{padding:8px 0}
    #ad-bottom{padding:8px 0}
  }
</style>
</head>
<body>

<!-- ===== ANUNCIO SUPERIOR (728x90) ===== -->
<div class="ad-slot" id="ad-top">
  <iframe id="ad-728-top" width="728" height="90" scrolling="no"></iframe>
</div>

<header class="topbar">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M4 4h16v4H4V4zm0 6h16v4H4v-4zm0 6h16v4H4v-4z"/></svg>
    Library
  </div>
  <nav class="tabs">
    <button class="active">Library</button>
    <button>Store</button>
    <button>Community</button>
  </nav>
  <div class="search">
    <input type="text" placeholder="Search library">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
  </div>
</header>

<main>
  <div class="section-head">
    <h2>All Games</h2>
    <span class="count">2 games installed</span>
  </div>

  <div class="grid">
    <!-- GTA V -->
    <a class="card" href="/gta5/" data-game="gta5">
      <img src="/img/gta5.jpg" alt="Grand Theft Auto V">
      <div class="badge">INSTALLED</div>
      <div class="overlay">
        <div class="name">Grand Theft Auto V</div>
      </div>
    </a>

    <!-- THE SIMPSONS: HIT & RUN -->
<a class="card" href="https://shar-wasm.cjoseph.workers.dev/?skipmovie" target="_blank" rel="noopener" data-game="simpsons">
  <img src="/img/simpsons.jpg" alt="The Simpsons: Hit & Run">
  <div class="badge">PLAY</div>
  <div class="overlay">
    <div class="name">The Simpsons: Hit &amp; Run</div>
  </div>
</a>

    <!-- Espacios vacíos -->
    <div class="card empty"></div>
    <div class="card empty"></div>
    <div class="card empty"></div>
    <div class="card empty"></div>
  </div>
</main>

<!-- ===== ANUNCIO INFERIOR (320x50) ===== -->
<div class="ad-slot" id="ad-bottom">
  <iframe id="ad-320-bottom" width="320" height="50" scrolling="no"></iframe>
</div>

<div id="loader">
  <div class="spin"></div>
  <div class="txt" id="loaderText">Launching...</div>
</div>

<script>
// ===== SERVICE WORKER =====
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { scope: '/' })
    .then(function(reg) {
      console.log('[SW] Registered', reg.scope);
      if (!navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then(function() {
          if (!sessionStorage.getItem('__sw_reload')) {
            sessionStorage.setItem('__sw_reload', '1');
            location.reload();
          }
        });
      }
    })
    .catch(function(err) { console.error('[SW] Failed:', err); });
}

// ===== CLICK EN CARD → LOADER =====
document.querySelectorAll('.card[data-game]').forEach(function(card) {
  card.addEventListener('click', function(e) {
    var name = card.querySelector('.name');
    document.getElementById('loaderText').textContent =
      'Launching ' + (name ? name.textContent : 'game') + '...';
    document.getElementById('loader').classList.add('on');
  });
});

// ===== INYECTAR ANUNCIOS DEL LAUNCHER =====
(function(){
  function injectAd(frameId, w, h, key) {
    var f = document.getElementById(frameId);
    if (!f) return;
    var doc = f.contentDocument || f.contentWindow.document;
    doc.open();
    doc.write('<!doctype html><html><head><meta charset="utf-8">' +
      '<style>html,body{margin:0;padding:0;overflow:hidden;background:transparent;}</style>' +
      '</head><body>');
    doc.write('<scr' + 'ipt>atOptions={"key":"' + key + '","format":"iframe","height":' + h + ',"width":' + w + ',"params":{}};</scr' + 'ipt>');
    doc.write('<scr' + 'ipt src="https://www.highrevenueformat.com/' + key + '/invoke.js"></scr' + 'ipt>');
    doc.write('</body></html>');
    doc.close();
  }
  injectAd('ad-728-top', 728, 90, '76a4887bf5246065c1644d5ff3ee96ae');
  injectAd('ad-320-bottom', 320, 50, '0c552db9603823b8354d2c686ebe16d7');
})();
</script>

</body>
</html>
