<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GTA V — Web Edition</title>

<link rel="preconnect" href="https://cdn.apkprojects.xyz" crossorigin>
<link rel="dns-prefetch" href="https://cdn.apkprojects.xyz">

<style>
	* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
	html, body { margin: 0; height: 100%; background: #000; color: #ccc;
		font: 12px 'Consolas','Menlo',monospace; overflow: hidden;
		-webkit-user-select: none; user-select: none; touch-action: none;
		overscroll-behavior: none; }
	#canvas { display: block; position: absolute; left: 0; top: 0;
		width: 100vw; height: 100vh; background: #000; touch-action: none; }

	#compat-screen {
		position: fixed; inset: 0; z-index: 7000;
		background: radial-gradient(ellipse at center, #0a0618 0%, #000 100%);
		display: none; flex-direction: column; align-items: center; justify-content: center;
		padding: 24px; overflow-y: auto;
	}
	#compat-screen.visible { display: flex; }
	#compat-screen h2 {
		font-family: 'Arial Black', sans-serif; font-size: 22px; font-weight: 900;
		letter-spacing: 4px; color: #ff7c7c; margin: 0 0 6px; text-align: center;
	}
	#compat-screen .cs-sub {
		font-size: 10px; letter-spacing: 4px; color: rgba(255,180,180,0.7);
		text-transform: uppercase; margin-bottom: 20px; text-align: center;
	}
	#compat-screen .cs-box {
		max-width: 520px; width: 100%; padding: 20px;
		background: rgba(0,0,0,0.6);
		border: 1px solid rgba(255,120,120,0.3);
		border-radius: 10px; text-align: left;
		line-height: 1.65; color: #cdd6f4; font-size: 12px;
		margin-bottom: 18px;
	}
	#compat-screen .cs-box b { color: #ff9c9c; }
	#compat-screen .cs-box code {
		background: rgba(255,120,120,0.15); padding: 1px 5px;
		border-radius: 3px; font-size: 11px; color: #ffb3b3;
	}
	#compat-screen .cs-box ol { padding-left: 18px; margin: 8px 0; }
	#compat-screen .cs-box li { margin-bottom: 6px; }
	#compat-screen .cs-status {
		font-size: 11px; color: rgba(200,200,220,0.7);
		margin-bottom: 12px; font-family: Consolas, monospace;
		white-space: pre-wrap; width: 100%; max-width: 520px;
		background: rgba(0,0,0,0.4); padding: 10px; border-radius: 6px;
		border: 1px solid rgba(150,150,255,0.15);
	}
	#compat-screen .cs-actions {
		display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
	}
	#compat-screen button {
		padding: 14px 24px;
		background: rgba(120,90,255,0.15);
		border: 1px solid #a78bfa; color: #fff;
		font-family: 'Consolas', monospace;
		font-size: 12px; letter-spacing: 2px;
		border-radius: 6px; cursor: pointer;
		touch-action: manipulation; -webkit-appearance: none; appearance: none;
	}
	#compat-screen button:active { background: rgba(120,90,255,0.4); }
	#compat-screen button.danger {
		border-color: #ff7c7c; background: rgba(255,120,120,0.1);
	}
	#compat-screen button.danger:active { background: rgba(255,120,120,0.3); }

	#device-select {
		position: fixed; inset: 0; z-index: 6000;
		background: radial-gradient(ellipse at center, #0a0618 0%, #000 100%);
		display: flex; flex-direction: column; align-items: center; justify-content: center;
		padding: 20px; touch-action: manipulation;
	}
	#device-select.hidden { display: none; }
	#device-select .ds-title {
		font-family: 'Arial Black', sans-serif; font-size: 54px; font-weight: 900;
		letter-spacing: 14px; color: #fff; margin-bottom: 6px;
		text-shadow: 0 0 20px rgba(180,120,255,0.7);
	}
	#device-select .ds-sub {
		font-size: 11px; letter-spacing: 6px; color: rgba(200,200,255,0.5);
		text-transform: uppercase; margin-bottom: 32px;
	}
	#device-select .ds-gpu {
		font-size: 10px; color: rgba(180,180,220,0.6);
		margin-bottom: 32px; padding: 8px 16px;
		background: rgba(0,0,0,0.4); border-radius: 6px;
		max-width: 90vw; text-align: center; line-height: 1.5;
	}
	#device-select .ds-cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
	#device-select .ds-card {
		position: relative; width: 180px; padding: 24px 16px;
		background: rgba(20,15,40,0.6);
		border: 2px solid rgba(150,150,255,0.25);
		border-radius: 12px; cursor: pointer;
		display: flex; flex-direction: column; align-items: center;
		color: #cdd6f4; font-family: 'Consolas', monospace;
		touch-action: manipulation; -webkit-appearance: none; appearance: none;
		transition: all 0.15s;
	}
	#device-select .ds-card:active { transform: scale(0.97); background: rgba(120,90,255,0.25); }
	#device-select .ds-card.detected { border-color: #7cffb2; box-shadow: 0 0 24px rgba(124,255,178,0.25); }
	#device-select .ds-card.detected::before {
		content: '✓ detectado'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
		background: #0a0618; padding: 2px 8px; font-size: 9px; letter-spacing: 2px; color: #7cffb2;
	}
	#device-select .ds-icon { font-size: 44px; margin-bottom: 10px; }
	#device-select .ds-name { font-size: 13px; font-weight: 700; letter-spacing: 2px; }
	#device-select .ds-detail { font-size: 10px; color: rgba(180,180,220,0.6); margin-top: 6px; text-align: center; }
	#device-select .ds-warn {
		margin-top: 24px; max-width: 500px; padding: 12px 16px;
		background: rgba(255,150,60,0.1); border: 1px solid rgba(255,150,60,0.4);
		border-radius: 8px; font-size: 11px; color: #ffb37c;
		line-height: 1.5; text-align: center;
	}

	#click-to-start {
		position: fixed; inset: 0; z-index: 5000;
		background: radial-gradient(ellipse at center, #0a0618 0%, #000 100%);
		display: flex; flex-direction: column; align-items: center; justify-content: center;
		padding: 20px; touch-action: manipulation;
	}
	#click-to-start.hidden { display: none; }
	#click-to-start .cts-logo {
		font-family: 'Arial Black', sans-serif; font-size: 82px; font-weight: 900;
		letter-spacing: 14px; color: #fff; margin-bottom: 12px;
		text-shadow: 0 0 20px rgba(180,120,255,0.9);
		animation: cts-glow 3s ease-in-out infinite;
	}
	@keyframes cts-glow {
		0%, 100% { text-shadow: 0 0 20px rgba(180,120,255,0.9), 0 0 60px rgba(120,180,255,0.5); }
		50%      { text-shadow: 0 0 40px rgba(180,120,255,1), 0 0 100px rgba(120,180,255,0.8); }
	}
	#click-to-start .cts-sub {
		font-size: 12px; letter-spacing: 12px; text-transform: uppercase;
		color: rgba(200,200,255,0.5); margin-bottom: 60px;
	}
	#cts-button {
		background: rgba(120,90,255,0.2); border: 2px solid #a78bfa; color: #fff;
		font-family: 'Arial Black', sans-serif; font-size: 18px; letter-spacing: 4px;
		padding: 20px 48px; border-radius: 8px; cursor: pointer;
		animation: cts-pulse 2s ease-in-out infinite;
		touch-action: manipulation;
	}
	#cts-button:active { background: rgba(120,90,255,0.5); transform: scale(0.97); }
	@keyframes cts-pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
	@media (max-width: 600px) {
		#click-to-start .cts-logo { font-size: 56px; letter-spacing: 10px; }
		#cts-button { font-size: 15px; padding: 16px 32px; }
	}

	#sound-toggle {
		position: fixed; top: max(24px, env(safe-area-inset-top)); right: max(24px, env(safe-area-inset-right));
		width: 44px; height: 44px;
		background: rgba(0,0,0,0.65); border: 1px solid rgba(180,120,255,0.4);
		border-radius: 50%; color: #a78bfa; font-size: 18px; cursor: pointer; z-index: 100;
		display: flex; align-items: center; justify-content: center;
		touch-action: manipulation;
	}
	#sound-toggle.muted { color: rgba(150,150,200,0.4); }

	#boot-screen {
		position: fixed; inset: 0; background: #05060a; z-index: 1000;
		display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
	}
	#boot-screen.visible { display: flex; }
	#boot-screen .boot-spinner {
		width: 64px; height: 64px; border: 3px solid rgba(120,100,255,0.15);
		border-top-color: #a78bfa; border-radius: 50%;
		animation: boot-spin 1s linear infinite; margin-bottom: 24px;
	}
	@keyframes boot-spin { to { transform: rotate(360deg); } }
	#boot-screen .boot-title {
		font-family: 'Arial Black', sans-serif; font-size: 28px; font-weight: 900;
		letter-spacing: 12px; color: #fff; margin-bottom: 8px;
		text-shadow: 0 0 20px rgba(180,120,255,0.6);
	}
	#boot-screen .boot-sub {
		font-size: 10px; letter-spacing: 6px; text-transform: uppercase;
		color: rgba(200,200,255,0.5); margin-bottom: 40px;
	}
	#boot-screen .boot-status {
		font-size: 11px; letter-spacing: 2px; color: rgba(180,180,220,0.7);
		min-height: 16px; text-align: center;
	}
	#boot-screen .boot-bar {
		width: 240px; height: 2px; background: rgba(150,150,255,0.12);
		border-radius: 1px; margin-top: 16px; overflow: hidden;
	}
	#boot-screen .boot-bar-fill {
		height: 100%; width: 0%;
		background: linear-gradient(90deg, #7c5cff, #6ac3ff);
		transition: width 0.4s ease-out;
	}

	#loading { position: fixed; inset: 0; background: #000; overflow: hidden; z-index: 5; opacity: 0; }
	#loading.done { opacity: 0; pointer-events: none; }
	#loading.visible { opacity: 1; }
	#ls-stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px;
		transform-origin: 0 0; overflow: hidden; font: 12px sans-serif; color: #fff; }
	#ls-screens { position: absolute; inset: 0; overflow: hidden; }
	.ls-screen { position: absolute; inset: 0; will-change: transform; }
	.ls-screen .screen-bg { position: absolute; inset: 0; }
	.screen-1 .screen-bg { background: radial-gradient(ellipse at 30% 40%, rgba(255,140,60,0.5) 0%, transparent 55%), linear-gradient(180deg, #1a0e1e 0%, #2d1220 50%, #0a0608 100%); }
	.screen-2 .screen-bg { background: radial-gradient(ellipse at 20% 70%, rgba(0,180,220,0.5) 0%, transparent 50%), linear-gradient(180deg, #050a18 0%, #0a1428 50%, #020408 100%); }
	.screen-3 .screen-bg { background: radial-gradient(circle at 50% 50%, rgba(255,200,100,0.35) 0%, transparent 40%), linear-gradient(180deg, #1a0e08 0%, #2a1408 60%, #0a0402 100%); }
	.screen-4 .screen-bg { background: radial-gradient(ellipse at 70% 30%, rgba(80,255,160,0.4) 0%, transparent 50%), linear-gradient(180deg, #021a0e 0%, #051428 50%, #020204 100%); }
	.screen-5 .screen-bg { background: radial-gradient(ellipse at 50% 20%, rgba(255,60,60,0.4) 0%, transparent 50%), linear-gradient(180deg, #1a0508 0%, #0a0518 60%, #000 100%); }
	.screen-6 .screen-bg { background: radial-gradient(ellipse at 30% 50%, rgba(255,200,255,0.3) 0%, transparent 45%), linear-gradient(180deg, #0a0814 0%, #180a24 50%, #05030a 100%); }
	.screen-7 .screen-bg { background: radial-gradient(ellipse at 60% 40%, rgba(255,100,200,0.4) 0%, transparent 45%), linear-gradient(180deg, #0a0416 0%, #1a0828 50%, #05020a 100%); }
	.screen-8 .screen-bg { background: radial-gradient(ellipse at 30% 40%, rgba(255,180,60,0.4) 0%, transparent 50%), linear-gradient(180deg, #1a1008 0%, #1a0818 60%, #050205 100%); }
	.screen-label {
		position: absolute; left: 80px; bottom: 180px;
		font-family: 'Arial Black', sans-serif; font-size: 44px; font-weight: 900;
		letter-spacing: 8px; color: rgba(255,255,255,0.9);
		text-shadow: 0 4px 20px rgba(0,0,0,0.9);
	}
	.screen-label small {
		display: block; font-size: 11px; font-weight: 400; letter-spacing: 6px;
		margin-top: 6px; color: rgba(255,255,255,0.5);
	}
	#kito-logo { position: absolute; left: 60px; top: 60px;
		font-family: 'Arial Black',sans-serif; font-size: 52px; font-weight: 900;
		letter-spacing: 10px; color: #fff;
		text-shadow: 0 0 12px rgba(180,120,255,.9), 0 0 30px rgba(120,180,255,.6);
		pointer-events: none; z-index: 10; }
	#kito-logo small { display: block; font-size: 10px; letter-spacing: 10px;
		margin-top: 4px; color: rgba(255,255,255,.7); text-shadow: none; font-weight: 400; }

	#ls-bars { position: absolute; right: 96px; top: 642px; display: flex; gap: 3px; z-index: 15; }
	.ls-bar { height: 24px; padding: 0 6px; display: flex; align-items: center;
		background: rgba(0,0,0,.7); border-radius: 2.4px; white-space: nowrap; }
	#modes { gap: 8px; }
	#modes button { display: flex; align-items: center; height: 24px; padding: 0;
		border: 0; background: none; color: #fff; font: 12px sans-serif; cursor: pointer; }
	#modes button:disabled { cursor: default; }
	#modes button[hidden] { display: none; }
	.ls-key { margin-left: 4px; min-width: 12px; height: 15px; padding: 0 4px;
		line-height: 16px; border-radius: 2px; background: #fff; color: #000;
		font-size: 10px; text-transform: uppercase; }
	#label { text-shadow: .85px .85px 1px rgba(0,0,0,.45); }
	#pct { margin-left: 15px; font-variant-numeric: tabular-nums; }

	#ls-log { position: absolute; left: 8px; right: 8px; bottom: 6px; display: flex;
		flex-direction: column; align-items: center; font: 10px/1.35 Consolas,monospace;
		color: rgba(190,190,190,.75); text-shadow: 0 0 2px #000;
		white-space: pre; pointer-events: none; z-index: 15; }
	#console { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
	#data { color: #6a9; }
	#bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
		background: rgba(255,255,255,.08); z-index: 15; }
	#fill { height: 100%; width: 0%;
		background: linear-gradient(90deg, #7c5cff, #6ac3ff);
		box-shadow: 0 0 12px rgba(124,92,255,.7); }

	#hud { position: fixed; left: 8px; bottom: 8px; max-width: 90vw;
		white-space: pre-wrap; opacity: .85; pointer-events: none;
		font: 11px Consolas,monospace; color: #9ad; z-index: 20; }

	#mobile-modes {
		position: fixed; inset: 0; z-index: 4500;
		background: rgba(0,0,0,0.88);
		backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
		display: none; flex-direction: column; align-items: center; justify-content: center;
		padding: 20px; gap: 16px;
		touch-action: manipulation;
	}
	#mobile-modes.visible { display: flex; }
	#mobile-modes .mm-title {
		font-family: 'Arial Black', sans-serif; font-size: 18px; font-weight: 900;
		letter-spacing: 4px; color: #fff; margin-bottom: 8px; text-align: center;
	}
	#mobile-modes .mm-btn {
		width: 100%; max-width: 380px;
		padding: 22px 24px;
		background: rgba(20,15,40,0.7);
		border: 2px solid rgba(150,150,255,0.35);
		border-radius: 12px;
		color: #fff;
		font-family: 'Arial Black', sans-serif;
		font-size: 16px; letter-spacing: 2px;
		cursor: pointer;
		text-align: left;
		touch-action: manipulation;
	}
	#mobile-modes .mm-btn:active {
		background: rgba(120,90,255,0.55);
		border-color: #a78bfa;
		transform: scale(0.98);
	}
	#mobile-modes .mm-btn .mm-desc {
		display: block; font-family: 'Consolas', monospace;
		font-size: 10px; color: rgba(200,200,255,0.55);
		letter-spacing: 1px; margin-top: 3px;
	}

	#touch-ui { position: fixed; inset: 0; z-index: 4000; pointer-events: none; display: none; touch-action: none; }
	#touch-ui.active { display: block; }
	#touch-look { position: absolute; left: 50%; right: 0; top: 0; bottom: 0; z-index: 0; pointer-events: auto; touch-action: none; }
	#touch-stick {
		position: absolute;
		left: max(20px, env(safe-area-inset-left));
		bottom: max(20px, env(safe-area-inset-bottom));
		width: 150px; height: 150px;
		border-radius: 50%;
		background: rgba(0,0,0,0.32);
		border: 2px solid rgba(150,150,255,0.35);
		z-index: 10; pointer-events: auto;
		display: flex; align-items: center; justify-content: center;
	}
	#touch-stick-knob {
		position: absolute; left: 50%; top: 50%;
		width: 58px; height: 58px; border-radius: 50%;
		background: radial-gradient(circle, rgba(180,120,255,0.8) 0%, rgba(120,90,255,0.6) 100%);
		transform: translate(-50%, -50%);
	}
	.touch-btn {
		position: absolute;
		display: flex; align-items: center; justify-content: center;
		border-radius: 50%;
		background: rgba(0,0,0,0.45);
		border: 2px solid rgba(150,150,255,0.4);
		color: rgba(255,255,255,0.92);
		font-family: 'Arial Black', sans-serif;
		font-weight: 900;
		z-index: 10; pointer-events: auto;
		user-select: none; -webkit-user-select: none;
		touch-action: none;
	}
	.touch-btn.active { background: rgba(120,90,255,0.7); border-color: #a78bfa; transform: scale(0.92); }
	.touch-btn-a, .touch-btn-b, .touch-btn-x, .touch-btn-y { width: 62px; height: 62px; font-size: 20px; }
	.touch-btn-y { right: calc(max(20px, env(safe-area-inset-right)) + 96px); bottom: calc(max(20px, env(safe-area-inset-bottom)) + 152px); }
	.touch-btn-x { right: calc(max(20px, env(safe-area-inset-right)) + 160px); bottom: calc(max(20px, env(safe-area-inset-bottom)) + 88px); }
	.touch-btn-b { right: calc(max(20px, env(safe-area-inset-right)) + 32px);  bottom: calc(max(20px, env(safe-area-inset-bottom)) + 88px); }
	.touch-btn-a { right: calc(max(20px, env(safe-area-inset-right)) + 96px); bottom: calc(max(20px, env(safe-area-inset-bottom)) + 24px); }
	.touch-btn-lb, .touch-btn-rb { width: 76px; height: 46px; border-radius: 12px; font-size: 14px; }
	.touch-btn-lb { left: max(16px, env(safe-area-inset-left)); top: max(16px, env(safe-area-inset-top)); }
	.touch-btn-rb { right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); }
	.touch-btn-start {
		width: 50px; height: 50px; font-size: 15px; border-radius: 12px;
		left: 50%; top: max(16px, env(safe-area-inset-top)); transform: translateX(-50%);
	}
</style>
</head>
<body>

<canvas id="canvas" width="1280" height="720" tabindex="-1"></canvas>
<div id="hud"></div>

<div id="compat-screen">
  <h2 id="cs-title">COMPROBANDO…</h2>
  <div class="cs-sub" id="cs-subtitle">Analizando hardware</div>
  <div class="cs-status" id="cs-status">Iniciando diagnóstico…</div>
  <div class="cs-box" id="cs-box" style="display:none"></div>
  <div class="cs-actions">
    <button id="cs-retry">↻ Reintentar</button>
    <button id="cs-force" class="danger">Forzar arranque</button>
  </div>
</div>

<div id="device-select">
  <div class="ds-title">KITO</div>
  <div class="ds-sub">Selecciona tu dispositivo</div>
  <div class="ds-gpu" id="ds-gpu-info">Analizando GPU…</div>
  <div class="ds-cards">
    <button class="ds-card" data-device="pc" id="ds-pc" type="button">
      <div class="ds-icon">💻</div>
      <div class="ds-name">PC / Escritorio</div>
      <div class="ds-detail">WebGPU · GPU dedicada</div>
    </button>
    <button class="ds-card" data-device="mobile" id="ds-mobile" type="button">
      <div class="ds-icon">📱</div>
      <div class="ds-name">Móvil / Tablet</div>
      <div class="ds-detail">Experimental</div>
    </button>
  </div>
  <div class="ds-warn" id="ds-warn" style="display:none"></div>
</div>

<div id="click-to-start" style="display:none">
  <div class="cts-logo">KITO</div>
  <div class="cts-sub">Web Edition</div>
  <button id="cts-button" type="button">▶ COMENZAR</button>
</div>

<button id="sound-toggle" title="Sonido">🔊</button>

<div id="boot-screen">
  <div class="boot-spinner"></div>
  <div class="boot-title">KITO</div>
  <div class="boot-sub">Web Edition</div>
  <div class="boot-status" id="boot-status">Inicializando...</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="boot-bar-fill"></div></div>
</div>

<div id="loading">
  <div id="ls-stage">
    <div id="ls-screens"></div>
    <div id="kito-logo">KITO<small>WEB EDITION</small></div>
    <div id="ls-bars">
      <div id="modes" class="ls-bar">
        <button data-act="back"></button>
        <button data-act="map5"></button>
        <button data-act="map6"></button>
        <button data-act="sandbox"></button>
        <button data-act="story"></button>
      </div>
      <div class="ls-bar">
        <span id="label">Starting...</span>
        <span id="pct">0%</span>
      </div>
    </div>
  </div>
  <div id="ls-log">
    <div id="data"></div>
    <div id="console"></div>
  </div>
  <div id="bar"><div id="fill"></div></div>
</div>

<div id="mobile-modes">
  <div class="mm-title" id="mm-title">ELIGE MODO</div>
  <div id="mm-buttons"></div>
</div>

// ✅ DIAGNÓSTICO REAL DE GPU

const diag = {
  webgpu: false,
  adapterName: '',
  features: [],
  hasBC: false,
  hasASTC: false,
  hasETC2: false,
  vendor: '',
  architecture: '',
  ram: navigator.deviceMemory || 0,
  cores: navigator.hardwareConcurrency || 0,
  verdict: 'unknown',
  reason: '',
};

async function runDiagnostic() {
  const st = document.getElementById('cs-status');
  const push = (line) => { st.textContent += '\n' + line; console.log('[Diag] ' + line); };

  push('Touch: ' + isTouchDevice + ' | Cores: ' + diag.cores + ' | RAM: ' + diag.ram + 'GB');

  if (!navigator.gpu) {
    diag.verdict = 'no-webgpu';
    diag.reason = 'WebGPU no está disponible en este navegador.';
    push('✗ navigator.gpu = undefined');
    return diag;
  }
  diag.webgpu = true;
  push('✓ WebGPU disponible');

  let adapter;
  try {
    adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!adapter) adapter = await navigator.gpu.requestAdapter();
  } catch (e) {
    diag.verdict = 'no-adapter';
    diag.reason = 'No se pudo obtener adaptador WebGPU: ' + e.message;
    push('✗ requestAdapter falló: ' + e.message);
    return diag;
  }

  if (!adapter) {
    diag.verdict = 'no-adapter';
    diag.reason = 'Sin adaptador WebGPU disponible.';
    push('✗ Sin adaptador');
    return diag;
  }

  const info = adapter.info || {};
  diag.adapterName = info.description || info.device || info.vendor || 'desconocida';
  diag.vendor = (info.vendor || '').toLowerCase();
  diag.architecture = (info.architecture || '').toLowerCase();
  push('Adaptador: ' + diag.adapterName);
  push('Vendor: ' + (info.vendor || '?') + ' | Arch: ' + (info.architecture || '?'));

  diag.features = [...adapter.features].map(f => f.toLowerCase());
  diag.hasBC = diag.features.includes('texture-compression-bc');
  diag.hasASTC = diag.features.includes('texture-compression-astc');
  diag.hasETC2 = diag.features.includes('texture-compression-etc2');
  push('Features: ' + diag.features.length + ' disponibles');
  push('  BC: ' + (diag.hasBC ? '✓' : '✗') + ' | ASTC: ' + (diag.hasASTC ? '✓' : '✗') + ' | ETC2: ' + (diag.hasETC2 ? '✓' : '✗'));

  if (diag.hasBC) {
    diag.verdict = 'ok';
    diag.reason = 'El adaptador soporta texture-compression-bc.';
  } else {
    // BC no soportado - el motor probablemente falle, pero intentamos
    diag.verdict = 'no-bc';
    diag.reason = 'El adaptador NO soporta texture-compression-bc. El motor puede crashear al compilar pipelines que usan texturas BC.';
  }

  return diag;
}

function showCompatScreen() {

(function() {
  const ignore = [
    /Bink is not available/i, /LookupVar\(.+\) failed/i,

    /Settings file missing/i, /ped HD assets/i,

    /grcResourceCache::/i, /grcDevice::/i, /writes colour output/i,
    /cloudflareinsights/i, /flip invoke buffers/i,
  ];
  const origE = console.error.bind(console);
  const origW = console.warn.bind(console);
  const skip = (args) => {
    const m = args.map(a => typeof a === 'string' ? a : (a?.message || String(a))).join(' ');
    return ignore.some(r => r.test(m));
  };
  console.error = (...a) => { if (!skip(a)) origE(...a); };
  console.warn  = (...a) => { if (!skip(a)) origW(...a); };
})();

let sharedAudioCtx = null;

function initAudioCtx() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || sharedAudioCtx) return;
    sharedAudioCtx = new AC({ latencyHint: 'interactive' });
    sharedAudioCtx.resume().catch(() => {});
    try {
      const buf = sharedAudioCtx.createBuffer(1, 1, sharedAudioCtx.sampleRate);
      const src = sharedAudioCtx.createBufferSource();
      src.buffer = buf; src.connect(sharedAudioCtx.destination); src.start(0);
    } catch (e) {}
  } catch (e) { console.warn('[Audio] init:', e); }
}

// ============================================================
// MÚSICA SIMPLE DE INTRO
// ============================================================
const AmbientAudio = (function() {
  let playing = false, masterGain = null, schedId = null, nextT = 0, step = 0;
  const TRACK = {
    bpm: 88,
    chords: [
      [57,60,64], [53,57,60], [48,52,55], [55,59,62]
    ],
    arp: [57,60,64,69,72,69,64,60],
    root: [45, 41, 36, 43],
  };
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function init() {
    if (!sharedAudioCtx) return;
    if (masterGain) return;
    masterGain = sharedAudioCtx.createGain();
    masterGain.gain.value = 0;
    masterGain.connect(sharedAudioCtx.destination);
  }
  function playNote(freq, t, dur, gain) {
    const o = sharedAudioCtx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.value = freq;
    const g = sharedAudioCtx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    const f = sharedAudioCtx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 2000;
    o.connect(g); g.connect(f); f.connect(masterGain);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function scheduler() {
    if (!playing || !sharedAudioCtx) return;
    const stepDur = 60 / TRACK.bpm / 4;
    while (nextT < sharedAudioCtx.currentTime + 0.15) {
      const bar = Math.floor(step / 16) % TRACK.chords.length;
      const beat = step % 16;
      if (beat === 0) {
        for (const n of TRACK.chords[bar]) playNote(mtof(n + 12), nextT, 1.6, 0.06);
      }
      if (beat % 2 === 1) {
        const idx = step % TRACK.arp.length;
        playNote(mtof(TRACK.arp[idx] + 12), nextT, 0.2, 0.08);
      }
      if (beat % 4 === 0) playNote(mtof(TRACK.root[bar]), nextT, 0.35, 0.15);
      nextT += stepDur;
      step++;
    }
    schedId = setTimeout(scheduler, 25);
  }
  function start() {
    init();
    if (!sharedAudioCtx || playing) return;
    if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume().catch(() => {});
    playing = true;
    step = 0;
    nextT = sharedAudioCtx.currentTime + 0.1;
    masterGain.gain.setValueAtTime(0, sharedAudioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0.5, sharedAudioCtx.currentTime + 2);
    scheduler();
  }
  function stop() {
    if (!playing) return;
    playing = false;
    if (schedId) clearTimeout(schedId);
    if (masterGain && sharedAudioCtx) {
      masterGain.gain.cancelScheduledValues(sharedAudioCtx.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, sharedAudioCtx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0, sharedAudioCtx.currentTime + 1.2);
    }
  }
  function toggle() { if (playing) stop(); else start(); return playing; }
  return { init, start, stop, toggle, isPlaying: () => playing };
})();

(function initSlidingScreens() {
  const holder = document.getElementById('ls-screens');
  if (!holder) return;
  const SCREENS = [
    { class: 'screen-1', label: 'LOS SANTOS', sub: 'CITY OF ANGELS' },
    { class: 'screen-2', label: 'VINEWOOD', sub: 'STARS & SUNSET' },
    { class: 'screen-3', label: 'SANDY SHORES', sub: 'DESERT HIGHWAY' },
    { class: 'screen-4', label: 'PALETO BAY', sub: 'FOREST & FOG' },
    { class: 'screen-5', label: 'DOWNTOWN', sub: 'NEON LIGHTS' },
    { class: 'screen-6', label: 'MT. CHILIAD', sub: 'FROZEN PEAK' },
    { class: 'screen-7', label: 'DEL PERRO', sub: 'PIER & OCEAN' },
    { class: 'screen-8', label: 'ROCKFORD HILLS', sub: 'WEALTH & POWER' },
  ];
  let currentEl = null, nextIndex = 0, alt = -1, stopped = false;
  function cubicInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(2 - 2 * t, 3) / 2; }
  function createScreen(def) {
    const el = document.createElement('div');
    el.className = 'ls-screen ' + def.class;
    el.innerHTML = '<div class="screen-bg"></div><div class="screen-label">' + def.label + '<small>' + def.sub + '</small></div>';
    return el;
  }
  function animateIn(el, fromX) {
    const duration = 900, startTime = performance.now(), toX = 0;
    el.style.transform = 'translateX(' + fromX + 'px)';
    function tick() {
      if (stopped) return;
      const t = Math.min(1, (performance.now() - startTime) / duration);
      const eased = cubicInOut(t);
      el.style.transform = 'translateX(' + (fromX + (toX - fromX) * eased) + 'px)';
      const label = el.querySelector('.screen-label');
      if (label) { label.style.transform = 'translateX(' + (40 * (1 - eased)) + 'px)'; label.style.opacity = eased; }
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  function animateOut(el, direction) {
    if (!el) return;
    const duration = 900, startTime = performance.now(), toX = direction * -1280;
    function tick() {
      const t = Math.min(1, (performance.now() - startTime) / duration);
      const eased = cubicInOut(t);
      el.style.transform = 'translateX(' + (toX * eased) + 'px)';
      if (t < 1) requestAnimationFrame(tick);
      else { try { el.remove(); } catch(e) {} }
    }
    requestAnimationFrame(tick);
  }
  function next() {
    if (stopped) return;
    alt = alt <= 0 ? 1 : -1;
    const oldEl = currentEl;
    const def = SCREENS[nextIndex];
    const newEl = createScreen(def);
    holder.appendChild(newEl);
    animateIn(newEl, alt * 1280);
    if (oldEl) animateOut(oldEl, alt);
    currentEl = newEl;
    nextIndex = (nextIndex + 1) % SCREENS.length;
    setTimeout(next, 8000);
  }
  setTimeout(next, 500);
  window.__stopSlidingScreens = () => { stopped = true; };
})();

const hud = document.getElementById('hud');
{

  bc.onmessage = (ev) => {

    lastActivity = performance.now();
    if (m.dl) { dataBytes += m.dl; samples.push([performance.now(), m.dl]); return; }
    if (m.lines) { lastLine = m.lines[m.lines.length - 1]; dirty = true; return; }
    if (m.error) { label.textContent = m.error; label.style.color = '#e66'; return; }
    if (m.pct > target) {
      target = m.pct;
      if (m.label) { lastLabel = m.label; if (!waitingChoice) label.textContent = m.label; }
    }
    if (m.choice && !startMode) { waitingChoice = true; showModes(); }
    if (m.commit) { startCommitted = true; pickingMap = false; if (m.mode) startMode = m.mode; showModes(); }
    if (m.world) {
      ready = true;
      setBoot(100, 'Listo');
      if (window.__stopSlidingScreens) window.__stopSlidingScreens();
      AmbientAudio.stop();
      mobileModes.classList.remove('visible');
    }
  };
  const dataEl = document.getElementById('data');
  const progressTimer = setInterval(() => {
    const now = performance.now();
    while (samples.length && now - samples[0][0] > 3000) samples.shift();
    const speed = samples.reduce((a, x) => a + x[1], 0) / 3;
    if (dataBytes) {
      dataEl.textContent = 'Game data: ' + (dataBytes / 1048576 | 0) + ' MB' + (speed > 1e4 ? ' (' + (speed / 1048576).toFixed(1) + ' MB/s)' : '');
    }
    const goal = ready ? 100 : Math.min(99, target + 6);
    shown += (goal - shown) * 0.05;
    if (dirty) { dirty = false; consoleEl.textContent = lastLine; }
    fill.style.width = shown.toFixed(1) + '%';
    pct.textContent = Math.round(shown) + '%';
    if (ready && shown > 99.5) {
      loading.classList.add('done');
      loadingGone = true;
      clearInterval(progressTimer);
    }
  }, 50);
}

// ============================================================
// DIAGNÓSTICO: si se atasca, mostrar mensaje
// ============================================================
setTimeout(() => {
  if (gameStarted && !document.getElementById('loading').classList.contains('done')) {
    const lbl = document.getElementById('label');
    const txt = (lbl && lbl.textContent) || '';
    if (/audio meta|audio metadata/i.test(txt) || txt === 'Starting...') {
      hud.textContent = 'Motor bloqueado. Probable: falta de soporte BC en tu GPU. Pulsa Forzar en la pantalla de compatibilidad.';
      hud.style.color = '#f96';
      hud.style.fontSize = '12px';
      hud.style.maxWidth = '90vw';
      hud.style.bottom = '80px';
    }
  }
}, 45000);

// ============================================================
// WORKER
// ============================================================
let canvasEl = document.getElementById('canvas');

function fetchWithTimeout(url, opts = {}, timeoutMs = 30000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(timer));
}

window.addEventListener('game-start', async () => {
  if (!crossOriginIsolated) {
    document.getElementById('label').textContent = 'sin aislamiento cross-origin: abre por HTTPS.';
    document.getElementById('label').style.color = '#e66';
    setBoot(100, 'Error: sin aislamiento');
    setTimeout(hideBootScreen, 2000);
    return;
  }

  setBoot(60, 'Preparando canvas...');

  const lowParam = q.get('low');
  // ✅ Móvil: SIEMPRE low + agresivo
  const lowMemory = lowParam === '1' || (lowParam !== '0' && ((navigator.deviceMemory || 8) <= 4 || touchMode));

  const LOW_ARGS = lowMemory ? [
    '-textureQuality=0', '-pedVariety=0', '-vehicleVariety=0',
    '-shadowQuality=-1', '-reflectionQuality=0', '-particleQuality=0', '-grassQuality=0',
    '-cityDensity=0', '-lodScale=0', '-pedLodBias=0', '-vehicleLodBias=0',
  ] : [];

  // ✅ Móvil: 4 cores máximo
  const cores = +(q.get('cores') || 0) || Math.min(navigator.hardwareConcurrency * 2, touchMode ? 4 : 32);

  const wantSize = () => {
    const forced = /^(\d+)x(\d+)$/.exec(q.get('res') || '');
    if (forced) return [+forced[1], +forced[2]];
    const sc = Math.max(0.25, Math.min(2, +(q.get('scale') || (touchMode ? 0.4 : 1))));
    let w = innerWidth * (devicePixelRatio || 1) * sc;
    let h = innerHeight * (devicePixelRatio || 1) * sc;
    // ✅ Móvil: cap 854x480 (una resolución muy baja pero jugable)
    const cap = lowMemory ? [854, 480] : [2560, 1440];
    const k = Math.min(1, cap[0] / w, cap[1] / h);
    w *= k; h *= k;
    return [Math.max(480, Math.round(w / 2) * 2), Math.max(270, Math.round(h / 2) * 2)];
  };
  const startSize = wantSize();
  canvasEl.width = startSize[0];
  canvasEl.height = startSize[1];
  canvasEl.style.width = '100vw';
  canvasEl.style.height = '100vh';
  const offscreen = canvasEl.transferControlToOffscreen();

  const LOG_ARGS = ['-Script_all=warning', '-replay_all=warning'];
  const ENGINE_ARGS = ['-fastscriptcore'];

  setBoot(70, 'Descargando assets críticos...');

  const CRITICAL = [
    { url: '/data/manifest.json',  label: 'Manifest' },
    { url: '/shaders/index.json',  label: 'Shaders' },
  ];
  const OPTIONAL = [
    { url: '/shaders/pipelines.json',      label: 'Pipelines' },
    { url: '/data/bootset.json',           label: 'Bootset' },
    { url: '/shaders/pipelines_low.json',  label: 'Pipelines low' },
    { url: '/data/bootset_low.json',       label: 'Bootset low' },
  ];

  for (const item of OPTIONAL) {
    fetchWithTimeout(item.url, { cache: 'reload' }, 60000)
      .catch((e) => console.warn('[Preload opt] ' + item.label + ': ' + (e.message || e)));
  }

  let preloadCount = 0;
  await Promise.all(CRITICAL.map(async (item) => {
    try {
      const res = await fetchWithTimeout(item.url, { cache: 'reload' }, 60000);
      if (res.ok) { await res.blob(); console.log('[Preload] ✓ ' + item.label); }
    } catch (e) { console.warn('[Preload] ' + item.label + ': ' + (e.message || e)); }
    preloadCount++;
    setBoot(70 + (preloadCount / CRITICAL.length) * 25, item.label + ' (' + preloadCount + '/' + CRITICAL.length + ')');
  }));

  setBoot(95, 'Iniciando motor...');

  const worker = new Worker(BASE + '/loader.js');
  worker.onmessage = (ev) => {
    if (ev.data.hud) hud.textContent = ev.data.hud;
    if (ev.data.input) {
      installInput(ev.data.input.memory, ev.data.input.block);
      if (touchMode) setupTouchControls();
    }
    if (ev.data.audio) {
      audioPending = ev.data.audio;
      tryStartAudio();
    }
  };
  worker.onerror = (e) => {
    hud.textContent = 'Worker error: ' + e.message;
    console.error('[KITO] worker error:', e);
  };

  const fpsParam = q.get('fps');
  const frameLimit = fpsParam === '0' ? 0 : fpsParam === '60' ? 1 : (touchMode ? 2 : 1);

  worker.postMessage({
    canvas: offscreen, base: BASE,
    args: ['-rootdir=/game/', ...(q.get('nogpu') ? [] : ['-wgpu']),
      '-nodisplaycalibration', '-noSocialClub', '-pc:nosocialclub',
      '-nonetwork', '-output',
      ...(touchMode ? ['-audioMixerThreads=1', '-audioUpdateThreads=1'] : []),
      '-width=' + startSize[0], '-height=' + startSize[1], '-forceResolution',
      ...LOG_ARGS, ...ENGINE_ARGS,
      '-frameLimit=' + frameLimit,
      ...(cores <= 2 ? ['-numCores=' + cores] : []),
      ...LOW_ARGS,
      ...(q.get('args') || '').split(',').filter(Boolean)],
    shotEvery: 0,
    cores, lowMemory,
    slots: touchMode ? 2 : (lowMemory ? 2 : 4),
    syncPipelines: false,
    remoteLog: false,
  }, [offscreen]);

  setTimeout(() => { setBoot(100, 'Iniciando...'); hideBootScreen(); }, 500);
});

// ============================================================
// AUDIO JUEGO
// ============================================================
function tryStartAudio() {
  if (!audioPending || audioStarted) return;
  audioStarted = true;
  (async () => {
    try {
      let ctx = sharedAudioCtx;
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
        sharedAudioCtx = ctx;
      }
      if (ctx.state !== 'running') { try { await ctx.resume(); } catch (e) {} }
      const workletLoad = ctx.audioWorklet.addModule(BASE + '/audio-worklet.js');
      const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 8000));
      await Promise.race([workletLoad, timeout]);
      const node = new AudioWorkletNode(ctx, 'game-audio', {
        numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2],
        processorOptions: audioPending,
      });
      node.connect(ctx.destination);
      console.log('[KITO] ✓ Audio enlazado');
    } catch (e) {
      audioStarted = false;
      console.warn('[KITO] ✗ Audio: ' + (e.message || e));
    }
  })();
}
for (const type of ['pointerdown', 'touchstart', 'keydown']) {
  addEventListener(type, () => { audioGesture = true; tryStartAudio(); }, { capture: true, passive: true });
}

// ============================================================
// INPUT
// ============================================================
const VK = {
  Backspace:0x08,Tab:0x09,Enter:0x0D,NumpadEnter:0xFD,Escape:0x1B,Space:0x20,
  ArrowLeft:0x25,ArrowUp:0x26,ArrowRight:0x27,ArrowDown:0x28,
  ShiftLeft:0xA0,ShiftRight:0xA1,ControlLeft:0xA2,ControlRight:0xA3,
  AltLeft:0xA4,AltRight:0xA5,Equal:0xBB,
};
for (let i = 0; i < 10; i++) { VK['Digit' + i] = 0x30 + i; VK['Numpad' + i] = 0x60 + i; }
for (let i = 0; i < 26; i++) VK['Key' + String.fromCharCode(65 + i)] = 0x41 + i;
for (let i = 1; i <= 24; i++) VK['F' + i] = 0x6F + i;

let inputRef = null;

function installInput(memory, block) {
  const keys = new Uint8Array(memory.buffer, block, 256);
  const w = new Int32Array(memory.buffer, block + 256, 10);
  const U16 = new Uint16Array(memory.buffer, block + 256 + 40, 64);
  const MX=0,MY=1,DX=2,DY=3,DZ=4,BTN=5,FOCUS=6,LOCKED=7,HEAD=8,TAIL=9;
  let W = canvasEl.width || 1280, H = canvasEl.height || 720;
  const ext = new Int32Array(memory.buffer, block + 424, 4);
  startModeWord = new Int32Array(memory.buffer, block + 440, 1);
  if (startMode) Atomics.store(startModeWord, 0, startMode);
  Atomics.store(ext, 2, W); Atomics.store(ext, 3, H);
  Atomics.store(w, FOCUS, document.hasFocus() ? 1 : 0);
  Atomics.store(w, MX, W >> 1); Atomics.store(w, MY, H >> 1);

  inputRef = { keys, w, W, H, MX, MY, DX, DY, BTN, FOCUS, LOCKED };

  addEventListener('keydown', (e) => {
    const vk = VK[e.code];
    if (vk) Atomics.store(keys, vk, 0x80);
  });
  addEventListener('keyup', (e) => {
    const vk = VK[e.code];
    if (vk) Atomics.store(keys, vk, 0);
  });
  addEventListener('contextmenu', (e) => e.preventDefault());
  canvasEl.addEventListener('mousedown', (e) => {
    if (document.pointerLockElement !== canvasEl) canvasEl.requestPointerLock({ unadjustedMovement: true }).catch(() => canvasEl.requestPointerLock());
    Atomics.or(w, BTN, 1 << [0,2,1,3,4][e.button]);
  });
  addEventListener('mouseup', (e) => { Atomics.and(w, BTN, ~(1 << [0,2,1,3,4][e.button])); });
  addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === canvasEl) {
      Atomics.add(w, DX, e.movementX);
      Atomics.add(w, DY, e.movementY);
    }
  });
}

// ============================================================
// TOUCH
// ============================================================
function setupTouchControls() {
  if (!inputRef) return;
  const ui = document.getElementById('touch-ui');
  if (ui.classList.contains('active')) return;
  ui.classList.add('active');

  const { keys, w, DX, DY, BTN } = inputRef;
  function setKey(code, down) {
    const vk = VK[code];
    if (vk === undefined) return;
    Atomics.store(keys, vk, down ? 0x80 : 0);
  }

  document.querySelectorAll('.touch-btn').forEach((btn) => {
    const keyCode = btn.dataset.key;
    const btnId = btn.dataset.btn;
    const press = (e) => {
      e.preventDefault(); e.stopPropagation();
      btn.classList.add('active');
      if (keyCode) setKey(keyCode, true);
      if (btnId !== undefined) Atomics.or(w, BTN, 1 << parseInt(btnId, 10));
    };
    const release = (e) => {
      e.preventDefault(); e.stopPropagation();
      btn.classList.remove('active');
      if (keyCode) setKey(keyCode, false);
      if (btnId !== undefined) Atomics.and(w, BTN, ~(1 << parseInt(btnId, 10)));
    };
    btn.addEventListener('touchstart', press, { passive: false });
    btn.addEventListener('touchend', release, { passive: false });
    btn.addEventListener('touchcancel', release, { passive: false });
  });

  const stick = document.getElementById('touch-stick');
  const knob = document.getElementById('touch-stick-knob');
  let stickId = null, cx = 0, cy = 0, r = 0;

  stick.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    stickId = t.identifier;
    const rect = stick.getBoundingClientRect();
    cx = rect.left + rect.width / 2;
    cy = rect.top + rect.height / 2;
    r = rect.width / 2 * 0.75;
  }, { passive: false });

  stick.addEventListener('touchmove', (e) => {
    if (stickId === null) return;
    for (const t of e.changedTouches) {
      if (t.identifier !== stickId) continue;
      e.preventDefault();
      let dx = t.clientX - cx, dy = t.clientY - cy;
      const d = Math.hypot(dx, dy);
      if (d > r) { dx = dx / d * r; dy = dy / d * r; }
      knob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
      const nx = dx / r, ny = dy / r;
      Atomics.store(keys, VK['KeyW'], ny < -0.3 ? 0x80 : 0);
      Atomics.store(keys, VK['KeyS'], ny >  0.3 ? 0x80 : 0);
      Atomics.store(keys, VK['KeyA'], nx < -0.3 ? 0x80 : 0);
      Atomics.store(keys, VK['KeyD'], nx >  0.3 ? 0x80 : 0);
    }
  }, { passive: false });

  const stickEnd = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier !== stickId) continue;
      e.preventDefault();
      stickId = null;
      knob.style.transform = 'translate(-50%, -50%)';
      Atomics.store(keys, VK['KeyW'], 0);
      Atomics.store(keys, VK['KeyS'], 0);
      Atomics.store(keys, VK['KeyA'], 0);
      Atomics.store(keys, VK['KeyD'], 0);
    }
  };
  stick.addEventListener('touchend', stickEnd, { passive: false });
  stick.addEventListener('touchcancel', stickEnd, { passive: false });

  const look = document.getElementById('touch-look');
  let lookId = null, lastLX = 0, lastLY = 0;

  look.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    lookId = t.identifier;
    lastLX = t.clientX; lastLY = t.clientY;
  }, { passive: true });

  look.addEventListener('touchmove', (e) => {
    if (lookId === null) return;
    for (const t of e.changedTouches) {
      if (t.identifier !== lookId) continue;
      const dx = t.clientX - lastLX, dy = t.clientY - lastLY;
      lastLX = t.clientX; lastLY = t.clientY;
      Atomics.add(w, DX, dx * 1.6);
      Atomics.add(w, DY, dy * 1.6);
    }
  }, { passive: true });

  look.addEventListener('touchend', () => { lookId = null; }, { passive: true });
  look.addEventListener('touchcancel', () => { lookId = null; }, { passive: true });
}
</script>
