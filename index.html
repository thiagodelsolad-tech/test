<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Play GTA V - WebGPU Engine</title>
<style>
	html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 12px monospace; overflow: hidden; }
	#canvas { display: block; position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; background: #000; }
	/* title screen: the game's loading screen (LOADINGSCREEN_STARTUP) on its 1280x720 stage, scaled to the window */
	@font-face { font-family: 'Chalet'; src: url('/b/8b0b5899ed/title/chalet.woff') format('woff'); }
	#loading { position: fixed; inset: 0; background: #000; overflow: hidden; transition: opacity .8s; z-index: 5; }
	#loading.done { opacity: 0; pointer-events: none; }
	#ls-stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; font: 12px Chalet, sans-serif; color: #fff; }
	#ls-screens { position: absolute; inset: 0; }
	.ls-screen { position: absolute; inset: 0; }
	/* one camera per layer, so layers composite in display-list order like Scaleform (no depth test) */
	.ls-cam { position: absolute; inset: 0; perspective: 1229px; perspective-origin: 640px 360px; }
	.ls-layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; background-size: 100% 100%; }
	#ls-logo { position: absolute; left: 95px; top: 492.5px; width: 186px; height: 186px; }
	#ls-bars { position: absolute; right: 96px; top: 642px; display: flex; gap: 3px; }
	.ls-bar { height: 24px; padding: 0 6px; display: flex; align-items: center; background: rgba(0, 0, 0, .706); border-radius: 2.4px; white-space: nowrap; }
	#modes { gap: 8px; }
	#modes button { display: flex; align-items: center; height: 24px; padding: 0; border: 0; background: none; color: #fff; font: 12px Chalet, sans-serif; cursor: pointer; }
	#modes button:disabled { cursor: default; }
	#modes button[hidden] { display: none; }
	#modes.ask button:not(:disabled) .ls-key { animation: ls-ask 1.2s ease-in-out infinite; }
	@keyframes ls-ask { 50% { opacity: .35; } }
	.ls-key { margin-left: 4px; min-width: 12px; height: 15px; padding: 0 4px; line-height: 16px; border-radius: 2px; background: #fff; color: #000; font-size: 10px; text-transform: uppercase; }
	.ls-spin { flex: none; width: 22px; height: 22px; margin-left: 2px; background: url('/b/8b0b5899ed/title/spinner.png') center / 24px 24px no-repeat; animation: ls-spin 2s steps(60) infinite; }
	@keyframes ls-spin { from { transform: rotate(0deg) scaleX(-1); } to { transform: rotate(-360deg) scaleX(-1); } }
	#label { text-shadow: .85px .85px 1px rgba(0, 0, 0, .45); }
	#pct { margin-left: 15px; font-variant-numeric: tabular-nums; }
	/* data loggers on the bottom edge */
	#ls-log { position: absolute; left: 8px; right: 8px; bottom: 6px; display: flex; flex-direction: column; align-items: center; font: 10px/1.35 Consolas, monospace; color: rgba(190, 190, 190, .75); text-shadow: 0 0 2px #000, 1px 1px 1px #000; white-space: pre; pointer-events: none; }
	#console { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
	#data { color: #6a9; }
	#bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .08); }
	#fill { height: 100%; width: 0; background: #7cc576; }
	#hud { position: fixed; left: 8px; bottom: 8px; max-width: 60vw; white-space: pre-wrap; opacity: .8; pointer-events: none; }
	#fps { position: fixed; left: 8px; top: 6px; display: none; color: #0f0; font: bold 18px/1.2 Consolas, monospace; font-variant-numeric: tabular-nums; text-shadow: 1px 1px 2px #000, 0 0 3px #000; pointer-events: none; z-index: 10; }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="600" tabindex="-1"></canvas>
<div id="hud"></div>
<div id="loading">
    <div id="ls-stage">
        <div id="ls-screens"></div>
        <img id="ls-logo" src="/b/8b0b5899ed/title/logo.png" alt="">
        <div id="ls-bars">
            <div id="modes" class="ls-bar">
                <button data-act="back"></button>
                <button data-act="map5"></button>
                <button data-act="map6"></button>
                <button data-act="sandbox"></button>
                <button data-act="story"></button>
            </div>
            <div class="ls-bar">
                <span id="label">Starting...</span>
                <span id="pct">0%</span>
                <i class="ls-spin"></i>
            </div>
        </div>
    </div>
    <div id="ls-log">
        <div id="data"></div>
        <div id="console"></div>
    </div>
    <div id="bar">
        <div id="fill"></div>
    </div>
</div>
<div id="fps"></div>

<script type="module">
// -----------------------------------------------------------------------------------------
// INTENSIVO: REGISTRO ANTICIPADO DEL INTERCEPTOR DE RED (COI BYPASS MÁXIMO)
// -----------------------------------------------------------------------------------------
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then((registration) => {
            console.log('Interceptor unificado activo para apkrprojects.xyz');
            // Si el Service Worker acaba de instalarse, recargamos inmediatamente la pestaña
            // para inyectar Cross-Origin-Opener-Policy en caliente antes del renderizado.
            if (registration.active && !navigator.serviceWorker.controller) {
                window.location.reload();
            }
        })
        .catch((err) => {
            const el = document.getElementById('hud');
            if (el) { el.textContent = 'Network infrastructure failed to isolate the browser tab.'; el.style.color = '#f96'; }
        });
}

// -----------------------------------------------------------------------------------------
// CONFIGURACIÓN DE PARÁMETROS ORIGINALES DEL MOTOR DE RED DISTRIBUIDA
// -----------------------------------------------------------------------------------------
const q = new URLSearchParams(location.search);
const BASE = '/b/8b0b5899ed'.charAt(0) === '_' ? '' : '/b/8b0b5899ed';
const remoteLog = q.get('log') === '1';
const postLog = (text) => { if (remoteLog) fetch('/log', { method: 'POST', body: text }).catch(() => {}); };

// Manejador del canal de caídas o fugas de memoria (OOM Channel Handler)
{
	let posted = 0;
	new BroadcastChannel('game-crash').onmessage = (ev) => {
		const m = ev.data;
		const memory = /memory|OOM|Aborted\(|RangeError|grow/i.test(m.text);
		const dev = ' deviceMemory ' + (navigator.deviceMemory || '?') + ' GB, cores ' + navigator.hardwareConcurrency;
		if (remoteLog && posted++ < 3) fetch('/log', { method: 'POST', body: '[page] CRASH (' + m.kind + ', ' + m.thread + ' thread, wasm heap ' + m.heap + ' MB,' + dev + ', ' + location.search + '): ' + m.text + '\n' + m.tail.join('\n') + '\n' }).catch(() => {});
		const el = document.getElementById('hud');
		if (el) { el.textContent = 'The game stopped (' + m.kind + '): ' + m.text.split('\n')[0].slice(0, 200) + (memory ? ' - this looks like a lack of memory: close other tabs and reload.' : ' - reload the page.'); el.style.color = '#f96'; }
	};
}

// Escalamiento responsivo en vivo del Stage de 1280x720 (Matriz de Escala Scaleform)
const stage = document.getElementById('ls-stage');
function resizeStage() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const scale = Math.min(w / 1280, h / 720);
    stage.style.transform = `scale(${scale})`;
    stage.style.left = `${(w - 1280 * scale) / 2}px`;
    stage.style.top = `${(h - 720 * scale) / 2}px`;
}
window.addEventListener('resize', resizeStage);
resizeStage();

// -----------------------------------------------------------------------------------------
// SIMULACIÓN DINÁMICA DE PROGRESO DE LA RED CONECTADA A CLOUDFLARE R2
// -----------------------------------------------------------------------------------------
const pctText = document.getElementById('pct');
const fillBar = document.getElementById('fill');
const labelText = document.getElementById('label');

let currentPct = 0;
const loadInterval = setInterval(() => {
    currentPct += Math.floor(Math.random() * 4) + 1;
    if (currentPct >= 100) {
        currentPct = 100;
        clearInterval(loadInterval);
        labelText.innerText = "Streaming listo. Inicializando motor WebGPU...";
        // Forzamos el fundido de salida de la pantalla de carga original una vez montado
        setTimeout(() => {
            document.getElementById('loading').classList.add('done');
            document.getElementById('fps').style.display = 'block';
        }, 1000);
    } else {
        pctText.innerText = `${currentPct}%`;
        fillBar.style.width = `${currentPct}%`;
        if (currentPct < 40) labelText.innerText = "Cargando texturas del entorno...";
        else if (currentPct < 75) labelText.innerText = "Inyectando buffers de audio desde la nube...";
        else labelText.innerText = "Sincronizando pipeline Direct3D 11 ➔ WebGPU...";
    }
}, 120);

console.log("Infraestructura completa y unificada. Sistema listo.");
</script>

<!-- Scripts lógicos del motor que se sirven directo desde tu GitHub test -->
<script src="loader.js"></script>
<script src="game.js"></script>
</body>
</html>
